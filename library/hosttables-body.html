<style>
/* A host's tables (seen by someone else): live, coming up, past. Same rows as My tables. */
.ht .hback{margin:0 0 14px;font-size:13.5px}.ht .hback a{color:var(--soft);text-decoration:none}.ht .hback a:hover{color:#fff}
.ht .hav{display:block;width:56px;height:56px;border-radius:50%;overflow:hidden;box-shadow:0 0 0 2px var(--gold);margin-bottom:14px}
.ht .hav svg{width:100%;height:100%;display:block}
.ht #hLede b{color:var(--fg);font-weight:600}.ht #hLede a{color:var(--teal);text-decoration:none}.ht #hLede a:hover{text-decoration:underline}
.ht .pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-top:22px;padding:2px}
.ht .pills::-webkit-scrollbar{display:none}
.ht .pills button{all:unset;cursor:pointer;flex:none;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--mute)}
.ht .pills button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.ht .pills button[aria-pressed=false] i{display:none}
.ht .pills button[aria-pressed=true]{border-color:#fff;color:var(--fg);background:rgba(255,255,255,.07)}
.ht .pills button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.ht .btn.go{background:var(--teal);border-color:var(--teal);color:#06262A}
.ht a.btn{text-decoration:none}
.ht .saved{display:inline-flex;align-items:center;gap:5px;color:var(--teal);font-size:12.5px}
.ht .saved svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ht .rn{color:var(--mute)}
@media(max-width:640px){.ht .pills{margin:18px -22px 0;padding:2px 22px}}
</style>
<div class="wrap ht">
  <section class="hero">
    <p class="hback"><a href="../../profile/timecapsule-profile.html" target="_top"><span aria-hidden="true">‹</span> <span>Gregory's profile</span></a></p>
    <span class="hav" id="hAv"></span>
    <h1>Gregory's tables</h1>
    <p id="hLede"></p>
    <div class="pills" id="tp" role="group" aria-label="Topics"></div>
  </section>
  <div id="hlist"></div>
</div>
<script>
(function(){
const UP=/*UP*/null, PAST=/*PAST*/null;
/*HELPERS*/
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c])}
const TICON={Philosophy:'<path d="M4 20h16M5 17h14M6 17V9m4 8V9m4 8V9m4 8V9M4 9h16L12 4z"/>',Religion:'<path d="M12 8.5v12M12 8.5C10 7.3 7 7 3.5 7.5v11.5c3.5-.5 6.5-.2 8.5 1M12 8.5c2-1.2 5-1.5 8.5-1v11.5c-3.5-.5-6.5-.2-8.5 1M12 2.5v2.5M8 3.5l1 1.8M16 3.5l-1 1.8"/>',Home:'<path d="M4 11l8-7 8 7M6 9.5V20h12V9.5M10 20v-5h4v5"/>',Craft:'<path d="M14 6l4 4M4 20l9.5-9.5M12 4.5l3-1.5 6 6-1.5 3-2-2-3 3-4.5-4.5 3-3z"/>',Energy:'<path d="M13 3L5 13h6l-1 8 8-10h-6l1-8z"/>',Travel:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.5 3.5 5.5 3.5 8.5s-1 6-3.5 8.5c-2.5-2.5-3.5-5.5-3.5-8.5s1-6 3.5-8.5z"/>'};
const DOC='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5M10 13h6M10 17h4"/></svg>';
$("hAv").innerHTML=av("Gregory");
const TOP=[];[...UP,...PAST].forEach(r=>{if(!TOP.some(t=>t.n===r.topic))TOP.push({n:r.topic,c:r.col})});
let T="";
const lib=r=>"../../library/timecapsule-library.html#r="+r.id+"&as=visitor";
function row(r,kind){
  const c=r.col,show=r.names.slice(0,5),more=Math.max(0,r.people-show.length);
  const tm=kind==="live"?`<div class="tm lv"><b><i></i>LIVE</b><span>${r.since}</span></div>`:kind==="up"?`<div class="tm"><b>${r.day} <span>${esc(r.mon)}</span></b><span>${esc(r.wd)} ${r.time}</span></div>`:`<div class="tm past"><b>${r.day} <span>${esc(r.mon)}</span></b><span>${esc(r.wd)}</span></div>`;
  const href=kind==="past"?(r.saved?lib(r):""):"table.html";
  const inner=`<div class="th" style="background:radial-gradient(circle at 35% 30%,${c},${c}66 75%,#252B52)"><svg viewBox="0 0 24 24" aria-hidden="true">${TICON[r.topic]||""}</svg></div>
    <div class="et"><h3 data-noi18n>${esc(r.title)}</h3><div class="meta"><span class="topic" style="--c:${c}"><i></i><span>${esc(r.topic)}</span></span>${r.round>1?`<span class="rn"><span>Round</span> ${r.round}</span>`:""}${kind==="past"&&r.saved?`<span class="saved">${DOC}<span>Discussion saved</span></span>`:""}</div></div>`;
  const act=kind==="live"?`<a class="btn go" href="table.html" target="_top">Join</a>`:kind==="up"?`<a class="btn go" href="table.html" target="_top">Save a chair</a>`:(r.saved?`<a class="btn" href="${lib(r)}" target="_top">Read</a>`:`<a class="btn" href="chats.html" target="_top">Ask Gregory</a>`);
  return `<article class="row" style="--c:${c}">${tm}
  ${href?`<a class="ei" href="${href}" target="_top" style="color:inherit;text-decoration:none">${inner}</a>`:`<div class="ei" style="cursor:default">${inner}</div>`}
  <div class="ppl"><span class="fc">${show.map((p,i)=>`<span class="${i===0?"mod":""}" style="z-index:${10-i}">${av(p)}</span>`).join("")}${more>0?`<em>+${more}</em>`:""}</span><small><b>${r.people} <span>people</span></b>${kind==="up"?` · ${r.free} <span>chairs free</span>`:""}</small></div>
  <div class="act">${act}</div></article>`}
function render(){
  const f=r=>!T||r.topic===T;
  const live=UP.filter(r=>r.live&&f(r)),up=UP.filter(r=>!r.live&&f(r)),past=PAST.filter(f);
  const nt=new Set(PAST.map(r=>r.topic)).size;
  $("hLede").innerHTML=`<b>${PAST.length}</b> <span>past tables</span> · <b>${UP.length}</b> <span>coming up</span> · <b>${nt}</b> <span>topics</span> · <a href="discussions.html#h=Gregory" target="_top"><span>See the discussions</span></a>`;
  $("tp").innerHTML=`<button type="button" data-t="" aria-pressed="${!T}">All</button>`+TOP.map(t=>`<button type="button" data-t="${esc(t.n)}" style="--c:${t.c}" aria-pressed="${T===t.n}"><i></i><span>${esc(t.n)}</span></button>`).join("");
  let h="";
  if(live.length||up.length)h+=`<section class="sec"><div class="sh"><h2>Coming up</h2><span>${live.length+up.length}</span></div>${live.map(r=>row(r,"live")).join("")}${up.map(r=>row(r,"up")).join("")}</section>`;
  const by={},order=[];past.forEach(r=>{if(!by[r.month]){by[r.month]=[];order.push(r.month)}by[r.month].push(r)});
  h+=order.map(m=>`<section class="sec"><div class="sh"><h2>${esc(m)}</h2><span>${by[m].length}</span></div>${by[m].map(r=>row(r,"past")).join("")}</section>`).join("");
  $("hlist").innerHTML=h||`<div class="empty"><b>Nothing here yet</b></div>`;
}
$("tp").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;T=T===b.dataset.t?"":b.dataset.t;render()});
render();
})();
</script>
