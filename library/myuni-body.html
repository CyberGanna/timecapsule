<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap">
<style>
/* My universe: Readings (editable) + Conversations, same calm list style as My tables */
.mu .tm span{color:var(--mute)}
.mu .role.host{color:var(--gold)}
.mu .priv{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--mute)}
.mu .priv svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mu .btn.go{background:var(--teal);border-color:var(--teal);color:#06262A}
.mu .btn.go:hover{filter:brightness(1.08)}
.mu a.btn{text-decoration:none}
.mu .cnt{margin:0;color:var(--mute);font-size:14px}.mu .cnt b{color:var(--fg);font-weight:600}
.mu .sw{display:flex;gap:22px;margin:6px 0 0}
.mu .sw button{all:unset;cursor:pointer;font-size:17px;color:var(--mute);padding:6px 0 7px;border-bottom:2px solid transparent}
.mu .sw button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--teal)}
.mu .sw button:focus-visible{outline:2px solid var(--teal);outline-offset:4px;border-radius:2px}
.mu .bar{margin-top:14px}
.mu .add{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:10px;border:1px solid var(--teal);background:none;color:var(--teal);font-weight:600;font-size:14px;cursor:pointer}
.mu .add svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.mu .add[aria-expanded=true]{opacity:.5}
.mu .form{margin:18px 0 4px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--surface);display:grid;gap:14px;grid-template-columns:1fr 1fr}
.mu .form[hidden]{display:none}
.mu .form .full{grid-column:1/-1}
.mu .form label{display:grid;gap:6px;font-size:13px;color:var(--mute)}
.mu .form input,.mu .form select{height:42px;border-radius:10px;border:1px solid var(--line);background:var(--raise);color:var(--fg);padding:0 12px;font:inherit;font-size:15px}
.mu .form input:focus,.mu .form select:focus{outline:2px solid var(--teal);outline-offset:1px}
.mu .seg{display:inline-flex;gap:2px;padding:3px;border-radius:10px;background:var(--raise);border:1px solid var(--line);width:max-content}
.mu .seg button{all:unset;cursor:pointer;height:30px;padding:0 14px;border-radius:7px;color:var(--mute);font-size:14px;display:inline-flex;align-items:center;gap:6px}
.mu .seg button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mu .seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.mu .form #fImpL{display:block}.mu #fImpL .pick{display:none;margin-left:8px;font-style:normal;color:#FFB4A8}.mu #fImpL.need .pick{display:inline}
.mu .yes{--r:var(--teal)}.mu .maybe{--r:var(--violet)}.mu .no{--r:#6B7299}
.mu .stars{display:flex;gap:8px;flex-wrap:wrap}
.mu .stars button{all:unset;cursor:pointer;height:32px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line);display:inline-flex;align-items:center;gap:7px;color:var(--mute);font-size:13.5px}
.mu .stars button i{width:8px;height:8px;border-radius:50%;background:var(--r)}
.mu .stars button[aria-pressed=true]{border-color:var(--r);background:color-mix(in srgb,var(--r) 20%,transparent);color:var(--fg)}
.mu .fact{display:flex;gap:8px;align-items:center}
.mu .fact small{color:var(--mute);font-size:12.5px;margin-left:auto}
.mu .item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.mu .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,var(--raise))}
.mu .ic svg{width:20px;height:20px;fill:none;stroke:var(--c);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.mu .item h3{margin:0;font-weight:600;font-size:15.5px;line-height:1.3}
.mu .item p{margin:2px 0 0;font-size:13px;color:var(--mute)}
.mu .item p .kind{color:var(--soft)}
.mu .rt{display:inline-flex;align-items:center;gap:5px;margin-left:10px;color:#C9CFF0;font-size:12.5px;white-space:nowrap}
.mu .rt i{width:7px;height:7px;border-radius:50%;background:var(--r)}
.mu .rm{all:unset;cursor:pointer;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--mute)}
.mu .rm:hover{background:var(--raise);color:var(--fg)}
.mu .rm svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.mu .item.new{animation:munew 1.6s ease}
@keyframes munew{from{background:color-mix(in srgb,var(--teal) 18%,transparent)}to{background:transparent}}
.mu .sh i{width:9px;height:9px;border-radius:50%;background:var(--c);display:inline-block;margin-right:10px;vertical-align:middle;transform:translateY(-2px)}
.mu .undo{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--raise);border:1px solid var(--line);color:var(--fg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:14px;align-items:center;font-size:14px;z-index:60;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.mu .undo[hidden]{display:none}
.mu .undo button{all:unset;cursor:pointer;color:var(--teal);font-weight:600}
.mu{--serif:'Newsreader',Georgia,serif}
.mu .dtools{display:flex;align-items:center;gap:16px;margin-top:18px}
.mu .pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1 1 auto;min-width:0;padding:2px}
.mu .pills::-webkit-scrollbar{display:none}
.mu .pills button{all:unset;cursor:pointer;flex:none;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--mute)}
.mu .pills button i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.mu .pills button[aria-pressed=false] i{display:none}
.mu .pills button[aria-pressed=true]{border-color:#fff;color:var(--fg);background:rgba(255,255,255,.07)}
.mu .pills button:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.mu .dtools .roles,.mu .dtools .add{flex:none}
.mu .dcnt{margin:14px 0 0;color:var(--mute);font-size:14px}.mu .dcnt b{color:var(--fg);font-weight:600}
.mu .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:16px 0 0}
.mu .card{position:relative;display:flex;flex-direction:column;gap:12px;padding:20px 20px 16px;border-radius:16px;border:1px solid var(--line);transition:border-color .2s,transform .2s}
.mu .card:hover{border-color:#4A5290;transform:translateY(-2px)}
.mu .card .lk{position:absolute;inset:0;border-radius:16px;z-index:1}
.mu .card .lk:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
.mu .ct{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--soft);min-width:0}
.mu .ct i{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.mu .ct .sub{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mu .ct .rn{margin-left:auto;flex:none;color:var(--mute)}
.mu .ct .priv{flex:none}
.mu .card h3{margin:0;font-size:17px;line-height:1.3;font-weight:600}
.mu .card blockquote{margin:0;font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.4;color:#DCE0F7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mu .card cite{font-style:normal;font-size:12.5px;color:var(--mute);margin-top:-4px}
.mu .cf{margin-top:auto;padding-top:12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--mute);min-width:0}
.mu .cf .host{color:var(--gold);font-weight:600;white-space:nowrap}
.mu .cf .dt{white-space:nowrap}
.mu .cf .nr{margin-left:auto;position:relative;z-index:2;color:#17C3C8;text-decoration:none;font-weight:600;white-space:nowrap}
.mu .cf .nr:hover{text-decoration:underline}
.mu .fc{display:flex;flex:none}
.mu .fc span{width:24px;height:24px;border-radius:50%;overflow:hidden;border:2px solid var(--bg);margin-left:-8px;position:relative}
.mu .fc span:first-child{margin-left:0}
.mu .fc span.h{box-shadow:0 0 0 1.5px var(--gold)}
.mu .fc svg{width:100%;height:100%;display:block}
@media (max-width:1000px){.mu .grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.mu .grid{grid-template-columns:1fr}.mu .dtools{flex-direction:column;align-items:stretch;gap:12px}.mu .dtools .add{align-self:flex-start}.mu .pills{margin:0 -22px;padding:2px 22px}.mu .dtools .roles{display:grid;grid-template-columns:repeat(3,1fr)}}
@media(max-width:700px){.mu .form{grid-template-columns:1fr}.mu .sw button{font-size:16px}}
</style>
<div class="wrap mu">
  <section class="hero">
<!--UNI-->    <h1>My universe</h1>
    <p class="intro">The books and films that shaped how you think, sorted by topic. Add one and it joins the map on your profile.</p>
    <div class="sw" role="tablist" aria-label="My universe">
      <button type="button" role="tab" id="sw-book" data-k="book" aria-selected="true" aria-controls="p-read">Books</button>
      <button type="button" role="tab" id="sw-film" data-k="film" aria-selected="false" aria-controls="p-read">Films</button>
    </div><!--/UNI-->
<!--CONV-->    <h1>My conversations</h1>
    <p class="intro">What your tables left behind, saved and sorted by topic. Read one again, or pick it up for a new round.</p><!--/CONV-->
  </section>

<!--UNI-->  <div id="p-read" role="tabpanel">
    <div class="dtools">
      <div class="pills" id="rpills" role="group" aria-label="Topics"></div>
      <button type="button" class="add" id="addBtn" aria-expanded="false" aria-controls="addForm"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg><span>Add</span></button>
    </div>
    <p class="dcnt"><b id="n-items"></b> <span id="n-items-l">items</span> · <b id="n-topics"></b> <span id="n-topics-l">topics</span></p>
    <form class="form" id="addForm" hidden autocomplete="off">
      <div class="full fact"><div class="seg" role="group" aria-label="Kind">
        <button type="button" data-k="book" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5-.7 1.5-1.5z"/></svg><span>Book</span></button>
        <button type="button" data-k="film" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4"/></svg><span>Film</span></button>
      </div></div>
      <label class="full"><span>Title</span><input id="fT" required maxlength="120"></label>
      <label><span id="fAl">Author</span><input id="fA" maxlength="80"></label>
      <label><span>Topic</span><select id="fTop"></select></label>
      <label class="full" id="fNewL" hidden><span>New topic</span><input id="fNew" maxlength="40"></label>
      <div class="full"><label style="margin-bottom:8px" id="fImpL"><span>How much did you like it?</span> <em class="pick">Pick one</em></label><div class="stars" id="fImp" role="group" aria-label="Rating">
        <button type="button" class="yes" data-v="yes" aria-pressed="false"><i></i><span>Mind-blowing</span></button><button type="button" class="maybe" data-v="maybe" aria-pressed="false"><i></i><span>Pleasant</span></button><button type="button" class="no" data-v="no" aria-pressed="false"><i></i><span>Not so inspiring</span></button>
      </div></div>
      <div class="full fact"><button type="submit" class="btn go">Add to my universe</button><button type="button" class="btn" id="fCancel">Cancel</button><small>It shows on your profile right away.</small></div>
    </form>
    <div id="rlist"></div>
  </div><!--/UNI-->

<!--CONV-->  <div id="p-lib">
    <div class="dtools">
      <div class="pills" id="dpills" role="group" aria-label="Topics"></div>
      <div class="roles" role="group" aria-label="Role">
        <button type="button" data-role="all" aria-pressed="true">All</button>
        <button type="button" data-role="host" aria-pressed="false">Hosted</button>
        <button type="button" data-role="in" aria-pressed="false">Joined</button>
      </div>
    </div>
    <p class="dcnt" id="dcnt"></p>
    <div id="mdlist"></div>
  </div><!--/CONV-->
  <div class="undo" id="undo" role="status" hidden><span id="undoT"></span><button type="button" id="undoB">Undo</button></div>
</div>
<script>
(function(){
const D=/*DATA*/null;
const RT=/*READ*/null;
const FILMS=/*FILMS*/null;
const PAGE=/*PAGE*/"uni";
/*HELPERS*/
const TICON={Philosophy:'<path d="M4 20h16M5 17h14M6 17V9m4 8V9m4 8V9m4 8V9M4 9h16L12 4z"/>',Religion:'<circle cx="12" cy="9.5" r="6.5" style="stroke-dasharray:0 3.4;stroke-width:2.6;stroke-linecap:round"/><path d="M12 16v3.2M10.3 21l1.7-1.8 1.7 1.8"/>',Home:'<path d="M4 11l8-7 8 7M6 9.5V20h12V9.5M10 20v-5h4v5"/>',Craft:'<path d="M14 6l4 4M4 20l9.5-9.5M12 4.5l3-1.5 6 6-1.5 3-2-2-3 3-4.5-4.5 3-3z"/>',Energy:'<path d="M13 3L5 13h6l-1 8 8-10h-6l1-8z"/>',Travel:'<circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.5 3.5 5.5 3.5 8.5s-1 6-3.5 8.5c-2.5-2.5-3.5-5.5-3.5-8.5s1-6 3.5-8.5z"/>'};
const KICON={book:'<path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5zM20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5c.8 0 1.5-.7 1.5-1.5z"/>',film:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5v14M17 5v14M3 9.5h4M3 14.5h4M17 9.5h4M17 14.5h4"/>'};
const XI='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const LOCK='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const NEWCOL=["#9BE3B4","#FFC27A","#B9C2FF","#FF8FB1"];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c])}
const $=id=>document.getElementById(id);
const on=(id,ev,fn)=>{const e=$(id);if(e)e.addEventListener(ev,fn)};

/* ---------- Readings ---------- */
let R;const KEY="tc-myuni-readings-v3";
function seed(){return RT.map((t,i)=>({n:t.n,c:t.c,b:t.b.map((x,j)=>({t:x[0],a:x[1],k:"book",imp:["yes","yes","maybe","yes","maybe","no"][j%6]})).concat((FILMS[t.n]||[]).map((x,j)=>({t:x[0],a:x[1],k:"film",imp:["yes","maybe","yes"][j%3]})))}))}
try{R=JSON.parse(localStorage.getItem(KEY))}catch(e){}
const K={kind:/(^#|&)films\b/.test(location.hash)?"film":"book"};
const ofK=b=>(b.k||"book")===K.kind;
if(!Array.isArray(R))R=seed();
function save(){try{localStorage.setItem(KEY,JSON.stringify(R))}catch(e){}}
let lastNew=null;
let RT0="";
function rpills(){if(RT0&&!R.some(t=>t.n===RT0&&t.b.some(ofK)))RT0="";$("rpills").innerHTML=`<button type="button" data-t="" aria-pressed="${!RT0}">All</button>`+R.filter(t=>t.b.some(ofK)).map(t=>`<button type="button" data-t="${esc(t.n)}" style="--c:${t.c}" aria-pressed="${RT0===t.n}"><i></i><span>${esc(t.n)}</span></button>`).join("")}
on("rpills","click",e=>{const b=e.target.closest("button");if(!b)return;RT0=RT0===b.dataset.t?"":b.dataset.t;renderRead()});
function renderRead(){
  rpills();
  const q=S.q.trim().toLowerCase();
  const vis=R.filter(t=>!RT0||t.n===RT0).map(t=>t.b.filter(b=>ofK(b)&&(!q||(b.t+" "+b.a+" "+t.n).toLowerCase().includes(q))).length);
  const n=vis.reduce((a,x)=>a+x,0),nt=vis.filter(x=>x).length;
  $("n-items").textContent=n;$("n-items-l").textContent=K.kind==="film"?(n===1?"film":"films"):(n===1?"book":"books");$("n-topics").textContent=nt;$("n-topics-l").textContent=nt===1?"topic":"topics";
  const html=R.map((t,ti)=>{let items=t.b.map((b,bi)=>({b,bi})).filter(o=>ofK(o.b));
    if(RT0&&t.n!==RT0)return"";
    if(q)items=items.filter(o=>(o.b.t+" "+o.b.a+" "+t.n).toLowerCase().includes(q));
    if(!items.length)return"";
    return `<section class="sec" style="--c:${t.c}"><div class="sh"><h2><i></i><span>${esc(t.n)}</span></h2><span>${items.length}</span></div>${items.map(({b,bi})=>`<div class="item${lastNew&&lastNew[0]===ti&&lastNew[1]===bi?" new":""}" style="--c:${t.c}"><div class="ic"><svg viewBox="0 0 24 24" aria-hidden="true">${KICON[b.k]||KICON.book}</svg></div><div><h3 data-noi18n>${esc(b.t)}</h3><p>${b.a?`<span data-noi18n>${esc(b.a)}</span>`:""}<span class="rt ${RL[b.imp]?b.imp:"maybe"}"><i></i><span>${RL[b.imp]||RL.maybe}</span></span></p></div><button type="button" class="rm" data-rm="${ti}:${bi}" aria-label="Remove ${esc(b.t)}" title="Remove">${XI}</button></div>`).join("")}</section>`}).join("");
  $("rlist").innerHTML=html||`<div class="empty"><b>${q?"Nothing matches your search":(K.kind==="film"?"No films yet":"No books yet")}</b><span>${q?"Try another word, or clear the search.":(K.kind==="film"?"Add a film that shaped how you think.":"Add a book that shaped how you think.")}</span></div>`;
  lastNew=null;
}
function fillTopics(sel){const o=R.map((t,i)=>`<option value="${i}">${esc(t.n)}</option>`).join("")+`<option value="new">New topic…</option>`;$("fTop").innerHTML=o;if(sel!=null)$("fTop").value=sel}
let kind="book",imp=null;const RL={yes:"Mind-blowing",maybe:"Pleasant",no:"Not so inspiring"};
function setKind(k){kind=k;document.querySelectorAll(".mu .seg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===k));$("fAl").textContent=k==="film"?"Director":"Author"}
function openForm(o){const f=$("addForm");f.hidden=!o;$("addBtn").setAttribute("aria-expanded",o);if(o){fillTopics(0);$("fNewL").hidden=true;$("fT").value="";$("fA").value="";$("fNew").value="";setKind(K.kind);setImp(null);$("fImpL").classList.remove("need");$("fT").focus()}}
function setImp(v){imp=v;if(v)$("fImpL").classList.remove("need");document.querySelectorAll("#fImp button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===v))}
on("addBtn","click",()=>openForm($("addForm").hidden));
on("fCancel","click",()=>openForm(false));
document.querySelectorAll(".mu .seg button").forEach(b=>b.addEventListener("click",()=>setKind(b.dataset.k)));
document.querySelectorAll("#fImp button").forEach(b=>b.addEventListener("click",()=>setImp(b.dataset.v)));
on("fTop","change",()=>{$("fNewL").hidden=$("fTop").value!=="new";if(!$("fNewL").hidden)$("fNew").focus()});
on("addForm","submit",e=>{e.preventDefault();const t=$("fT").value.trim();if(!t){$("fT").focus();return}if(!imp){$("fImpL").classList.add("need");document.querySelector("#fImp button").focus();return}
  let ti=$("fTop").value;
  if(ti==="new"){const nn=$("fNew").value.trim();if(!nn){$("fNew").focus();return}let ex=R.findIndex(x=>x.n.toLowerCase()===nn.toLowerCase());if(ex<0){R.push({n:nn,c:NEWCOL[R.length%NEWCOL.length],b:[]});ex=R.length-1}ti=ex}else ti=+ti;
  R[ti].b.unshift({t,a:$("fA").value.trim(),k:kind,imp});lastNew=[ti,0];save();openForm(false);if(kind!==K.kind)setKindTab(kind);renderRead();
  const el=document.querySelector(".mu .item.new");if(el)el.scrollIntoView({behavior:"smooth",block:"center"});
  toast((kind==="film"?"Film":"Book")+" added",null)});
let undoFn=null,undoTimer=0;
function toast(msg,fn){$("undoT").textContent=msg;$("undoB").hidden=!fn;undoFn=fn;$("undo").hidden=false;clearTimeout(undoTimer);undoTimer=setTimeout(()=>{$("undo").hidden=true;undoFn=null},5000)}
$("undoB").addEventListener("click",()=>{if(undoFn)undoFn();$("undo").hidden=true;undoFn=null});
on("rlist","click",e=>{const b=e.target.closest("[data-rm]");if(!b)return;const[ti,bi]=b.dataset.rm.split(":").map(Number);const it=R[ti].b.splice(bi,1)[0];save();renderRead();
  toast("Removed",()=>{R[ti].b.splice(bi,0,it);save();renderRead()})});

/* ---------- Conversations ---------- */
const S={role:"all",t:"",q:"",none:/(^#|&)new\b/.test(location.hash)};
const list=$("mdlist");
function again(r){return "create.html#again=1&th="+encodeURIComponent(r.topic)+"&q="+encodeURIComponent(r.title)}
function lib(r){return "../../library/timecapsule-library.html#r="+r.id}
function stack(r){return '<span class="fc" aria-hidden="true">'+r.names.slice(0,4).map((n,i)=>'<span class="'+(i?"":"h")+'" style="z-index:'+(9-i)+'">'+av(n)+'</span>').join("")+'</span>'}
function card(r){return `<article class="card" style="--c:${r.col}"><a class="lk" href="${lib(r)}" target="_top" aria-label="Open ${esc(r.title)}"></a>
  <div class="ct"><i></i><span>${esc(r.topic)}</span><span class="sub">· <span>${esc(r.sub)}</span></span><span class="rn">${r.rounds>1?`<span>Round</span> ${r.rounds}`:""}</span>${r.private?`<span class="priv">${LOCK}<span>Private</span></span>`:""}</div>
  <h3 data-noi18n>${esc(r.title)}</h3>
  <blockquote data-noi18n>“${esc(r.quote[1])}”</blockquote><cite><span>said</span> <span data-noi18n>${esc(r.quote[0])}</span></cite>
  <div class="cf">${stack(r)}<span class="host">You host</span><span class="dt">${r.day} <span>${esc(r.mon3)}</span></span><a class="nr" href="${again(r)}" target="_top">New round</a></div>
</article>`}
const TOPS=[];D.forEach(r=>{if(!TOPS.some(t=>t.n===r.topic))TOPS.push({n:r.topic,c:r.col})});
function pills(){$("dpills").innerHTML=`<button type="button" data-t="" aria-pressed="${!S.t}">All</button>`+TOPS.map(t=>`<button type="button" data-t="${esc(t.n)}" style="--c:${t.c}" aria-pressed="${S.t===t.n}"><i></i><span>${esc(t.n)}</span></button>`).join("")}
on("dpills","click",e=>{const b=e.target.closest("button");if(!b)return;S.t=S.t===b.dataset.t?"":b.dataset.t;pills();renderLib()});
function renderLib(){
  const q=S.q.trim().toLowerCase();
  let rs=S.none?[]:D.filter(r=>S.role!=="in");
  if(S.t)rs=rs.filter(r=>r.topic===S.t);
  if(q)rs=rs.filter(r=>(r.title+" "+r.topic+" "+r.sub).toLowerCase().includes(q));
  const nt=new Set(rs.map(r=>r.topic)).size;
  $("dcnt").innerHTML=`<b>${rs.length}</b> <span>${rs.length===1?"conversation":"conversations"}</span> · <b>${nt}</b> <span>${nt===1?"topic":"topics"}</span>`;
  if(!rs.length){let h;
    if(S.none)h=`<b>No saved conversations yet</b><span>After a table, save its transcript and notes and they will show up here.</span><br><a class="btn go" href="agenda.html" target="_top">Find a table</a>`;
    else if(q)h=`<b>Nothing matches your search</b><span>Try another word, or clear the search.</span>`;
    else h=`<b>Nothing here yet</b><span>Conversations you join at someone else's table will show up here.</span>`;
    $("dcnt").hidden=true;list.innerHTML=`<div class="empty">${h}</div>`;return}
  $("dcnt").hidden=false;
  list.innerHTML=`<div class="grid">${rs.map(card).join("")}</div>`;
}
document.querySelectorAll(".mu .roles button").forEach(b=>b.addEventListener("click",()=>{S.role=b.dataset.role;document.querySelectorAll(".mu .roles button").forEach(x=>x.setAttribute("aria-pressed",x===b));renderLib()}));

/* ---------- switch + search ---------- */
function setKindTab(k){K.kind=k;document.querySelectorAll(".mu .sw button").forEach(b=>b.setAttribute("aria-selected",b.dataset.k===k))}
function onQ(v){S.q=v;if(PAGE==="uni")renderRead();else renderLib()}
const q=$("q");if(q){q.placeholder=PAGE==="uni"?"Search my universe":"Search my conversations";q.addEventListener("input",()=>onQ(q.value))}
const sq=document.querySelector("#tch .tch-sbar input");if(sq){sq.placeholder=PAGE==="uni"?"Search my universe":"Search my conversations";sq.addEventListener("input",()=>onQ(sq.value))}
if(PAGE==="uni"){
  document.querySelectorAll(".mu .sw button").forEach(b=>b.addEventListener("click",()=>{if(b.dataset.k===K.kind)return;openForm(false);RT0="";setKindTab(b.dataset.k);renderRead();try{history.replaceState(null,"",location.pathname+location.search+"#"+(K.kind==="film"?"films":"books")+(/lang=\w+/.test(location.hash)?"&"+location.hash.match(/lang=\w+/)[0]:""))}catch(e){}}));
  addEventListener("hashchange",()=>{const k=/(^#|&)films\b/.test(location.hash)?"film":"book";if(k!==K.kind){setKindTab(k);renderRead()}});
  setKindTab(K.kind);renderRead();
}else{
  addEventListener("hashchange",()=>{S.none=/(^#|&)new\b/.test(location.hash);renderLib()});
  pills();renderLib();
}
})();
</script>
