<!doctype html><html lang="en"><head><meta charset="utf-8"><title>From gatekeepers to the table · TimeCapsule</title><style>@font-face{font-family:'Sora';font-weight:300;font-style:normal;src:url(../src/fonts/sora300.woff) format('woff')}@font-face{font-family:'Sora';font-weight:400;font-style:normal;src:url(../src/fonts/sora400.woff) format('woff')}@font-face{font-family:'Sora';font-weight:600;font-style:normal;src:url(../src/fonts/sora600.woff) format('woff')}@font-face{font-family:'Newsreader';font-weight:400;font-style:normal;src:url(../src/fonts/nr400.woff) format('woff')}@font-face{font-family:'Newsreader';font-weight:500;font-style:normal;src:url(../src/fonts/nr500.woff) format('woff')}@font-face{font-family:'Newsreader';font-weight:400;font-style:italic;src:url(../src/fonts/nr400i.woff) format('woff')}

*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0E1230;--ink:#1C1F33;--muted:#6B6F86;--violet:#7C5CFF;--teal:#17C3C8;--deep:#3B2A9E;--paper:#FBFAF7;--line:#E6E3DC}

</style></head><body><script>
const DATA=["<div class=\"tag\" data-keep=\"1\">Internal</div>", "<h1 data-keep=\"1\">From gatekeepers <b>to the table</b></h1>", "<h2 data-keep=\"1\">The short version</h2>", "<p class=\"lead\">Institutions once controlled who could be heard, and above all what words like &ldquo;knowledge,&rdquo; &ldquo;reason&rdquo; and &ldquo;serious&rdquo; were allowed to mean. Social media opened the door but replaced them with algorithms and attention. TimeCapsule starts from a different premise: every space for ideas has gates, so the question is whether they are hidden or visible. It is an open space where anyone can introduce an idea, and where the idea develops through conversation, questioning and disagreement. Nobody rules on what is true, but the rules of the conversation are public. What is preserved is the reasoning, the objections and the open questions, so they can be examined again.</p>", "<h2 data-keep=\"1\">The argument</h2>", "<h3 data-keep=\"1\"><span>01</span>The age of gatekeepers</h3>", "<p>Universities, churches, publishers and the press controlled many of the channels through which ideas gained recognition. But their deeper power was over language. They defined what counted as knowledge, evidence and a serious argument, and whoever did not speak that language was heard as noise. This provided scrutiny, but also restricted participation, and trust in these institutions has eroded as their biases and failures have become visible.</p>", "<h3 data-keep=\"1\"><span>02</span>The age of the feed</h3>", "<p>Social media lowered the barriers to publishing, and that was a real step forward. But it replaced the old gatekeepers with new ones: algorithms, platform owners and an attention economy. Ideas spread by their power to provoke, not by how well they hold up. Reach became disconnected from scrutiny. Anyone could speak, but only inside moderation systems and a vocabulary that someone else had set.</p>", "<p>TimeCapsule has no feed, so it does not have this problem. It has the problem the feed was hiding: how people find each other and who gets seated at which table. That is a gate too, and it is designed openly. Tables form through invitation and shared questions, never through ranking by popularity.</p>", "<h3 data-keep=\"1\"><span>03</span>The table</h3>", "<p>Anyone can introduce an idea. Nobody is appointed to decide in advance which ideas deserve a hearing. Ideas enter small conversations where participants question assumptions, challenge conclusions and offer different perspectives. Professional expertise, lived experience, research and critical reasoning are different kinds of knowledge, and each can be brought to the table.</p>", "<p><b>Language belongs to the table.</b> No one has to speak in an academic register to be heard. A story, an example and a simple question all count as contributions. Tables run in the participants&rsquo; own language, with translation available. When a disagreement is really about what a word means, the table marks it as a dispute over meaning, not over facts. The platform&rsquo;s own terms are open to challenge in the same way.</p>", "<p><b>No verdict on truth, but a discipline of reasoning.</b> Conversation does not guarantee truth, and a group can reinforce the same mistake. So TimeCapsule separates verdicts from procedure. It never declares a claim true or false. It keeps the rules of criticism visible:</p>", "<div class=\"it\">Claims are marked by kind (factual, interpretive, value-based), because each needs a different kind of support.</div>", "<div class=\"it\">Sources are disclosed, and a claim with none is marked as unsupported.</div>", "<div class=\"it\">A fallacy can be named openly by any participant, and the name stays attached to the argument.</div>", "<div class=\"it\">An unanswered objection stays attached to the claim it challenges.</div>", "<div class=\"it last\">The record shows the status of a claim (&ldquo;contested,&rdquo; &ldquo;unanswered&rdquo;), not a ruling.</div>", "<p>Rules need enforcement, and enforcement is a form of gatekeeping. We do not hide that. Moderation applies to the conduct and the rules of the conversation, never to opinions. It is public, it states its reasons, and it can be appealed.</p>", "<p><b>Guarding against indoctrination.</b> Indoctrination works through repetition, closed groups and imbalance. So a table of like-minded people is not enough. Tables are built to include different perspectives, a place for dissent is built into every table, and how a table was assembled is visible to everyone. Ideas are only truly tested when different perspectives meet.</p>", "<h3 data-keep=\"1\"><span>04</span>Private first, public by choice</h3>", "<p>A permanent record is valuable, but a record alone makes thinking difficult. Ideas need a space where people can be tentative, be wrong and change their minds unobserved. So TimeCapsule has two spaces:</p>", "<div class=\"it\">Direct, private conversation is never recorded unless every participant agrees.</div>", "<div class=\"it\">The record holds only what participants have chosen to place there.</div>", "<div class=\"it last\">Participants can annotate or retract a position and mark that they have changed their mind. Revising is treated as honesty, not as defeat.</div>", "<p>A capsule is sealed first and opened later. The record works the same way.</p>", "<h3 data-keep=\"1\"><span>05</span>Weight without a scoreboard</h3>", "<p>Conversation does not mean counting agreement. An idea&rsquo;s weight comes from how well it stands up: which objections it has answered, and which remain open. Agreement can be manufactured and is no proof of truth. Reputation can be gamed too, and no system can prevent that completely. TimeCapsule makes it costly and visible:</p>", "<div class=\"it\">Agreement and trust from people who disagree with you count more than from allies.</div>", "<div class=\"it\">Reputation is tied to a domain and fades over time.</div>", "<div class=\"it\">There is no single public score, and trust cannot be transferred or traded.</div>", "<div class=\"it\">Anyone can reply to and appeal against damage to their reputation, and the reply is kept beside the claim.</div>", "<div class=\"it last\">Patterns such as mutual vouching, coordinated groups and duplicate accounts are detected and shown openly.</div>", "<h2 data-keep=\"1\">The central line</h2>", "<div class=\"line\"><p>Institutions controlled who could be heard and what words meant. Social media handed visibility to algorithms and attention. TimeCapsule opens the door to everyone, keeps its own gates visible and open to challenge, and lets ideas earn their weight through conversation.</p></div>", "<h2 data-keep=\"1\">Why this is already reflected in the product</h2>", "<div class=\"it\"><b>Small tables:</b> You cannot simply broadcast. You have to participate and respond.</div>", "<div class=\"it\"><b>No feed, followers or public counts:</b> Attention and popularity are not the currency of the platform.</div>", "<div class=\"it\"><b>Private space and the chosen record:</b> What is said in private stays private. Only what participants choose enters the record.</div>", "<div class=\"it\"><b>TimeCoins and Trusted:</b> Reputation develops through real interactions with people who have sat at the table, and is tied to a domain and fades over time.</div>", "<div class=\"it last\"><b>Preserved conversations:</b> Ideas, objections and open questions remain accessible, so future participants can revisit and challenge them.</div>", "<h2 data-keep=\"1\">What makes TimeCapsule different</h2>", "<p>It isn&rsquo;t simply that people talk. It is the combination of three things:</p>", "<div class=\"it\"><b>Conversation with a procedure.</b> Open participation, with public rules of criticism instead of a ruling on truth.</div>", "<div class=\"it\"><b>A record that people control.</b> Private by default, public by consent, and revisable.</div>", "<div class=\"it last\"><b>Trust spread across many people.</b> Weight that comes from answered objections and varied relationships, never from a ranking.</div>"], HEAD="<div class=\"head\"><div class=\"logo\"><svg viewBox=\"0 -6 110 82\" aria-hidden=\"true\"><defs><clipPath id=\"ID\"><circle cx=\"35\" cy=\"35\" r=\"30\"/><path d=\"M13.8 56.2 L4 74 L29.8 64.5 Z\"/></clipPath><mask id=\"IDm\" maskUnits=\"userSpaceOnUse\" x=\"0\" y=\"-6\" width=\"110\" height=\"82\"><rect x=\"0\" y=\"-6\" width=\"110\" height=\"82\" fill=\"#fff\"/><g fill=\"#000\"><circle cx=\"36\" cy=\"35\" r=\"4.6\"/><circle cx=\"74\" cy=\"35\" r=\"4.6\"/><rect x=\"36\" y=\"33.4\" width=\"38\" height=\"3.2\"/></g></mask></defs><g mask=\"url(#IDm)\"><circle cx=\"35\" cy=\"35\" r=\"30\" fill=\"#7C5CFF\"/><path d=\"M13.8 56.2 L4 74 L29.8 64.5 Z\" fill=\"#7C5CFF\"/><circle cx=\"75\" cy=\"35\" r=\"30\" fill=\"#17C3C8\"/><path d=\"M96.2 13.8 L106 -4 L80.2 5.5 Z\" fill=\"#17C3C8\"/><g clip-path=\"url(#ID)\"><circle cx=\"75\" cy=\"35\" r=\"30\" fill=\"#3B2A9E\"/><path d=\"M96.2 13.8 L106 -4 L80.2 5.5 Z\" fill=\"#3B2A9E\"/></g></g></svg><span class=\"wt\"><b>time</b><i>capsule</i></span></div><div class=\"num\"></div></div>", FOOT="From gatekeepers to the table \u00b7 Internal";
window.paginate=function(){
let cid=0;
function newPage(){const s=document.createElement('section');s.className='page';
 s.innerHTML=HEAD.replace(/ID/g,'h'+(cid++))+'<div class="body"></div><div class="pagefoot"><span>'+FOOT+'</span><span>TimeCapsule</span></div>';
 document.body.appendChild(s);return s.querySelector('.body');}
const over=b=>b.scrollHeight>b.clientHeight+1;
let body=newPage();
for(const h of DATA){const t=document.createElement('div');t.innerHTML=h;const el=t.firstChild;body.appendChild(el);
 if(over(body)){body.removeChild(el);const moved=[];
  while(body.lastElementChild&&body.lastElementChild.dataset.keep){moved.unshift(body.lastElementChild);body.removeChild(body.lastElementChild);}
  body=newPage();moved.forEach(m=>body.appendChild(m));body.appendChild(el);if(over(body))console.log('OVERFLOW');}}
const ps=document.querySelectorAll('.page');if(ps.length>1)ps.forEach((p,i)=>p.querySelector('.num').textContent=(i+1)+' / '+ps.length);
window.PAGES=ps.length;};
</script></body></html>
