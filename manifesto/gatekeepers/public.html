<!doctype html><html lang="en"><head><meta charset="utf-8"><title>TimeCapsule · Think together</title><style>@font-face{font-family:'Sora';font-weight:300;font-style:normal;src:url(../src/fonts/sora300.woff) format('woff')}@font-face{font-family:'Sora';font-weight:400;font-style:normal;src:url(../src/fonts/sora400.woff) format('woff')}@font-face{font-family:'Sora';font-weight:600;font-style:normal;src:url(../src/fonts/sora600.woff) format('woff')}@font-face{font-family:'Newsreader';font-weight:400;font-style:normal;src:url(../src/fonts/nr400.woff) format('woff')}@font-face{font-family:'Newsreader';font-weight:500;font-style:normal;src:url(../src/fonts/nr500.woff) format('woff')}@font-face{font-family:'Newsreader';font-weight:400;font-style:italic;src:url(../src/fonts/nr400i.woff) format('woff')}
@page{size:A4;margin:0}
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0E1230;--ink:#1C1F33;--muted:#6B6F86;--violet:#7C5CFF;--teal:#17C3C8;--deep:#3B2A9E;--paper:#FBFAF7;--line:#E6E3DC}
html,body{background:var(--paper)}
body{font-family:'Newsreader',Georgia,serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.page{width:210mm;height:297mm;position:relative;overflow:hidden;page-break-after:always;padding:30mm 26mm 26mm}
.page:last-child{page-break-after:auto}
.logo{display:flex;align-items:center;gap:10px;font-family:'Sora',sans-serif}
.logo svg{width:46px;height:34px}
.wt{font-size:22px;letter-spacing:-.01em}
.wt b{font-weight:600}.wt i{font-style:normal;font-weight:300}
/* cover */
.cover{background:var(--navy);color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:34mm 26mm}
.cover .logo svg{width:92px;height:68px}
.cover .wt{font-size:44px}
.cover .big{margin-top:auto}
.cover .words{font-family:'Sora',sans-serif;font-weight:300;font-size:15px;letter-spacing:.32em;color:#B9BCD6;margin-top:22px}
.cover .words span{color:#fff;font-weight:400}
.cover .dot{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--teal);vertical-align:middle;margin:0 14px 3px}
.cover .rule{width:56px;height:3px;border-radius:2px;background:linear-gradient(90deg,var(--violet),var(--teal));margin-bottom:26px}
.cover .foot{font-family:'Sora',sans-serif;font-size:10px;letter-spacing:.2em;color:#7F84A6;text-transform:uppercase}
/* text pages */
.head{display:flex;justify-content:space-between;align-items:center;position:absolute;top:14mm;left:26mm;right:26mm}
.head .logo svg{width:26px;height:19px}.head .wt{font-size:13px;color:var(--navy)}
.head .num{font-family:'Sora',sans-serif;font-size:9px;letter-spacing:.2em;color:var(--muted)}
.eyebrow{font-family:'Sora',sans-serif;font-size:11px;letter-spacing:.28em;color:var(--violet);font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:12px}
.eyebrow::before{content:"";width:22px;height:2px;background:linear-gradient(90deg,var(--violet),var(--teal));border-radius:2px}
h1{font-family:'Sora',sans-serif;font-weight:300;font-size:34px;letter-spacing:-.02em;color:var(--navy);line-height:1.15;margin-bottom:9mm}
h1 b{font-weight:600}
p{font-size:12.5pt;line-height:1.58;margin-bottom:4mm;hyphens:none}
p.lead{font-size:14pt;line-height:1.48;color:var(--navy)}
ul{list-style:none;margin:2mm 0 5mm}
li{position:relative;padding-left:9mm;font-size:12.5pt;line-height:1.58;margin-bottom:4mm}
li::before{content:"";position:absolute;left:0;top:.42em;width:10px;height:10px;border-radius:50%;border:2px solid var(--teal);background:#fff}
li b{font-family:'Sora',sans-serif;font-weight:600;font-size:11.5pt;color:var(--navy)}
.pagefoot{position:absolute;bottom:13mm;left:26mm;right:26mm;border-top:1px solid var(--line);padding-top:4mm;font-family:'Sora',sans-serif;font-size:8.5px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase;display:flex;justify-content:space-between}

@page{size:letter;margin:0}
:root{--bg:#1B2144;--surface:#20264A;--raise:#252B52;--fg:#EEF1FF;--soft:#C9CFF0;--mute:#A9B0D6;--ln:#3A4175;--gold:#F2C14E}
html,body{background:var(--bg)}
body{font-family:'Sora',sans-serif;color:var(--fg)}
.page{width:8.5in;height:11in;padding:0;background:var(--bg)}
.body{position:absolute;left:21mm;right:21mm;top:24.5mm;bottom:21.5mm;overflow:hidden}
.head{top:12.5mm;left:21mm;right:21mm}.pagefoot{left:21mm;right:21mm;bottom:11.5mm;border-top-color:var(--ln);color:var(--mute)}
.head .wt{color:var(--fg)}.head .num{color:var(--mute)}
.tag{display:inline-block;font-size:8pt;font-weight:400;color:var(--soft);border:1px solid var(--ln);border-radius:99px;padding:1.2mm 3.4mm;margin-bottom:4mm}
h1{font-family:'Sora',sans-serif;font-weight:400;font-size:32px;letter-spacing:-.02em;color:var(--fg);line-height:1.15;margin-bottom:7mm}
h1 b{font-weight:400}
p{font-family:'Sora',sans-serif;font-weight:300;font-size:9.5pt;line-height:1.58;color:var(--soft);margin-bottom:2.4mm}
p.lead{font-weight:400;font-size:10.8pt;line-height:1.55;color:var(--fg)}
p b{font-weight:600;color:var(--fg)}
h2{font-family:'Sora',sans-serif;font-weight:400;font-size:9.4pt;color:var(--fg);margin:6mm 0 2.8mm;display:flex;align-items:center;gap:2.4mm}
h2::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--violet)}
h3{font-family:'Sora',sans-serif;font-weight:600;font-size:12.5pt;color:var(--fg);margin:4.4mm 0 2.2mm;padding-top:3mm;border-top:1px solid var(--ln)}
h3 span{color:var(--teal);font-weight:400;font-size:9pt;margin-right:3mm}
.body>:first-child{margin-top:0}
.it{position:relative;padding-left:6mm;font-weight:300;font-size:9.4pt;line-height:1.52;color:var(--soft);margin-bottom:1.6mm}
.it::before{content:"";position:absolute;left:.5mm;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--teal)}
.it b{font-weight:600;color:var(--fg)}
.it.last{margin-bottom:3.4mm}
.line{margin:1mm 0 2mm;background:var(--surface);border:1px solid var(--ln);border-radius:4mm;padding:5.5mm 6.5mm}
.line p{font-family:'Newsreader',Georgia,serif;font-style:italic;font-weight:400;font-size:15pt;line-height:1.42;color:var(--fg);margin:0}

.pub h1{font-size:34px;line-height:1.2;margin-bottom:8mm}
.pub h1 b{color:var(--mute)}
.pub p.lead{font-size:12.4pt;line-height:1.6;margin-bottom:4mm}
.pub p{font-size:10.6pt;line-height:1.65;margin-bottom:3.4mm}
.four{display:grid;grid-template-columns:1fr 1fr;gap:4.5mm;margin:5mm 0 5mm}
.four>div{background:var(--surface);border:1px solid var(--ln);border-radius:4mm;padding:4.6mm 5mm}
.four .k{font-size:8.6pt;color:var(--fg);margin-bottom:2.4mm;display:flex;align-items:center;gap:2.2mm}
.four .k::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c,var(--violet))}
.four>div:nth-child(2){--c:var(--teal)}.four>div:nth-child(3){--c:var(--gold)}.four>div:nth-child(4){--c:#FF8FB1}
.four p{font-size:10.2pt;line-height:1.55;margin:0}
.close{background:var(--surface);border:1px solid var(--ln);border-radius:4mm;padding:7mm 8mm;margin-top:6mm}
.close p{font-family:'Newsreader',Georgia,serif;font-style:italic;font-weight:400;color:var(--fg);font-size:17pt;line-height:1.4;margin:0}
</style></head><body><script>
const DATA=["<div class=\"pub\"><h1>We have more ways to communicate than ever, <b>but fewer opportunities to really think together.</b></h1><p class=\"lead\">Most online spaces are built around sharing, reacting and attracting attention. But some conversations deserve more time. They deserve different perspectives, thoughtful questions and the freedom to explore an idea without having to reduce it to a post or a quick reaction.</p><p>We are creating a place where people can come together around subjects they care about, exchange ideas and learn from different perspectives.</p><div class=\"four\"><div><div class=\"k\">The problem</div><p>Online communication is abundant, but meaningful conversation is harder to find.</p></div><div><div class=\"k\">The experience</div><p>People meet around subjects, exchange ideas and explore different perspectives.</p></div><div><div class=\"k\">The difference</div><p>Conversations have room to develop, rather than being lost in an endless feed.</p></div><div><div class=\"k\">The value</div><p>What emerges from a conversation can be preserved and revisited.</p></div></div><p>Conversations don&rsquo;t simply disappear. They can become something people return to, explore further and build upon.</p><div class=\"close\"><p>Not just another place to share what you think. A place to discover what we can think together.</p></div></div>"], HEAD="<div class=\"head\"><div class=\"logo\"><svg viewBox=\"0 -6 110 82\" aria-hidden=\"true\"><defs><clipPath id=\"ID\"><circle cx=\"35\" cy=\"35\" r=\"30\"/><path d=\"M13.8 56.2 L4 74 L29.8 64.5 Z\"/></clipPath><mask id=\"IDm\" maskUnits=\"userSpaceOnUse\" x=\"0\" y=\"-6\" width=\"110\" height=\"82\"><rect x=\"0\" y=\"-6\" width=\"110\" height=\"82\" fill=\"#fff\"/><g fill=\"#000\"><circle cx=\"36\" cy=\"35\" r=\"4.6\"/><circle cx=\"74\" cy=\"35\" r=\"4.6\"/><rect x=\"36\" y=\"33.4\" width=\"38\" height=\"3.2\"/></g></mask></defs><g mask=\"url(#IDm)\"><circle cx=\"35\" cy=\"35\" r=\"30\" fill=\"#7C5CFF\"/><path d=\"M13.8 56.2 L4 74 L29.8 64.5 Z\" fill=\"#7C5CFF\"/><circle cx=\"75\" cy=\"35\" r=\"30\" fill=\"#17C3C8\"/><path d=\"M96.2 13.8 L106 -4 L80.2 5.5 Z\" fill=\"#17C3C8\"/><g clip-path=\"url(#ID)\"><circle cx=\"75\" cy=\"35\" r=\"30\" fill=\"#3B2A9E\"/><path d=\"M96.2 13.8 L106 -4 L80.2 5.5 Z\" fill=\"#3B2A9E\"/></g></g></svg><span class=\"wt\"><b>time</b><i>capsule</i></span></div><div class=\"num\"></div></div>", FOOT="Think together";
window.paginate=function(){
let cid=0;
function newPage(){const s=document.createElement('section');s.className='page';
 s.innerHTML=HEAD.replace(/ID/g,'h'+(cid++))+'<div class="body"></div><div class="pagefoot"><span>'+FOOT+'</span><span>TimeCapsule</span></div>';
 document.body.appendChild(s);return s.querySelector('.body');}
const over=b=>b.scrollHeight>b.clientHeight+1;
let body=newPage();
for(const h of DATA){const t=document.createElement('div');t.innerHTML=h;const el=t.firstChild;body.appendChild(el);
 if(over(body)){body.removeChild(el);const moved=[];
  while(body.lastElementChild&&body.lastElementChild.dataset.keep){moved.unshift(body.lastElementChild);body.removeChild(body.lastElementChild);}
  body=newPage();moved.forEach(m=>body.appendChild(m));body.appendChild(el);if(over(body))console.log('OVERFLOW');}}
const ps=document.querySelectorAll('.page');if(ps.length>1)ps.forEach((p,i)=>p.querySelector('.num').textContent=(i+1)+' / '+ps.length);
window.PAGES=ps.length;};
</script></body></html>
