<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TimeCapsule Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap">
<style>
/* Layout: slim top bar, fixed left sidebar of sections, one working area per section; drawers slide in from the right for detail and edits. */
:root{--bg:#1B2144;--side:#171C3B;--surface:#20264A;--raise:#252B52;--line:#3A4175;--line2:#2D3463;--fg:#EEF1FF;--mute:#A9B0D6;--soft:#C9CFF0;--teal:#17C3C8;--teal-ink:#0E1430;--violet:#7C5CFF;--gold:#F2C14E;--good:#3DDC84;--warn:#F2C14E;--bad:#FF6B7A;--font:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--side)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:12px;height:60px;background:var(--side);border-bottom:1px solid var(--line2);padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.logo{display:flex;align-items:center;gap:10px;font-size:19px;letter-spacing:-.5px;color:var(--fg);text-decoration:none;white-space:nowrap}
.logo svg{width:34px;height:25px;flex:none}
.logo b{font-weight:600}.logo i{font-style:normal;font-weight:300}
.tag-admin{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);border:1px solid color-mix(in srgb,var(--gold) 45%,transparent);border-radius:6px;padding:2px 7px;font-weight:500}
.top .sp{flex:1}
.gsearch{position:relative;width:clamp(160px,28vw,320px)}
.gsearch input{width:100%;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px 0 34px;outline:none;font-size:13.5px}
.gsearch input:focus{border-color:var(--mute)}
.gsearch svg{position:absolute;left:11px;top:10px;width:16px;height:16px;color:var(--mute)}
.back{color:var(--mute);text-decoration:none;font-size:13.5px;white-space:nowrap}
.back:hover{color:var(--fg)}
.me{display:flex;align-items:center;gap:9px}
.me .ph{width:34px;height:34px;border-radius:50%;overflow:hidden;flex:none}
.me .ph svg{display:block;width:100%;height:100%}
.me small{display:block;color:var(--gold);font-size:11.5px;line-height:1.2}
.me b{display:block;font-weight:500;font-size:13.5px;line-height:1.25}

/* shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:calc(100vh - 60px)}
.side{background:var(--side);border-right:1px solid var(--line2);padding:16px 12px 24px;padding-left:max(12px,env(safe-area-inset-left,0px))}
.side nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);display:flex;flex-direction:column;gap:2px}
.side h6{margin:14px 10px 6px;font-size:11px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.side h6:first-child{margin-top:0}
.side a{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:9px;color:var(--soft);text-decoration:none;font-size:14px}
.side a svg{width:18px;height:18px;flex:none;color:var(--mute)}
.side a:hover{background:var(--surface);color:var(--fg)}
.side a[aria-current=page]{background:var(--raise);color:var(--fg)}
.side a[aria-current=page] svg{color:var(--teal)}
.side a .ct{margin-left:auto;font-size:11.5px;color:var(--mute)}
.side a .ct.alert{color:var(--bg);background:var(--warn);border-radius:9px;padding:0 6px;font-weight:600}
main{min-width:0;padding-block:28px 80px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.page{max-width:1180px}
.ph1{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.ph1 h1{margin:0;font-weight:400;font-size:clamp(26px,3vw,32px);letter-spacing:-.03em;line-height:1.1}
.ph1 p{margin:6px 0 0;color:var(--mute);font-size:14px}
.ph1 .acts{display:flex;gap:8px;flex-wrap:wrap}

/* controls */
.btn{text-decoration:none;color:var(--fg);height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:none;font-size:13.5px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--mute)}
.btn.pri{background:var(--teal);border-color:var(--teal);color:var(--teal-ink);font-weight:600}
.btn.vio{background:var(--violet);border-color:var(--violet);color:#fff;font-weight:600}
.btn.red{background:var(--bad);border-color:var(--bad);color:#1B0B12;font-weight:600}
.btn.redo{color:#FF8E9A;border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
.lnk{background:none;border:0;padding:4px 0;color:var(--teal);font-weight:500;font-size:13.5px;text-decoration:none}
.lnk:hover{text-decoration:underline;text-underline-offset:3px}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.bar .sp{flex:1}
.day{height:34px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:none;font-size:13.5px;font-weight:500;white-space:nowrap}
.day:hover{border-color:var(--mute)}
.day[aria-pressed=true]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.sel{height:34px;border-radius:10px;border:1px solid var(--line);background:var(--raise);padding:0 10px;font-size:13.5px;max-width:100%}
.fsearch{height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 12px;outline:none;font-size:13.5px;width:220px;max-width:100%}
.fsearch:focus{border-color:var(--mute)}
.pts{display:flex;gap:14px}
.pts button{background:none;border:0;padding:4px 0;font-size:13.5px;font-weight:500;color:var(--mute)}
.pts button:hover{color:var(--soft)}
.pts button[aria-pressed=true]{color:var(--fg)}

/* topic tag: dot + name, box only when tappable */
.tp{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;color:var(--soft)}
.tp i{width:8px;height:8px;border-radius:50%;flex:none}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--mute);font-size:13px}
.pill i{display:none;width:8px;height:8px;border-radius:50%}
.pill[aria-pressed=true]{border-color:var(--fg);color:var(--fg);background:rgba(255,255,255,.06)}
.pill[aria-pressed=true] i{display:block}

/* chips for state */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--soft);white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--mute)}
.st.good::before{background:var(--good)}.st.warn::before{background:var(--warn)}.st.bad::before{background:var(--bad)}.st.live::before{background:var(--good);box-shadow:0 0 0 3px rgba(61,220,132,.2)}.st.teal::before{background:var(--teal)}
.role{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;border-radius:6px;padding:2px 7px;white-space:nowrap}
.role.owner{color:var(--gold);background:rgba(242,193,78,.13)}
.role.admin{color:#B9A8FF;background:rgba(124,92,255,.18)}
.role.support{color:var(--teal);background:rgba(23,195,200,.13)}
.trusted{display:inline-flex;align-items:center;gap:3px;padding:2px 6px 2px 4px;border-radius:5px;background:#7FF0F2;color:#12304A;font-size:10.5px;font-weight:600;line-height:1.5;letter-spacing:0;text-transform:none;vertical-align:middle;font-family:Sora,sans-serif}
.trusted svg{flex:none;width:12px;height:12px}

/* data tables */
.tw{overflow-x:auto;border:1px solid var(--line2);border-radius:14px;background:var(--surface)}
table.dt{width:100%;border-collapse:collapse;font-size:13.5px}
.dt th{text-align:left;font-weight:500;font-size:12px;color:var(--mute);padding:11px 14px;border-bottom:1px solid var(--line2);white-space:nowrap;background:var(--surface);position:sticky;top:0}
.dt td{padding:10px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
.dt tr:last-child td{border-bottom:0}
.dt tbody tr{cursor:pointer}
.dt tbody tr:hover td{background:var(--raise)}
.dt td.r,.dt th.r{text-align:right}
.dt .m{color:var(--mute)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who .ph{width:32px;height:32px;border-radius:50%;overflow:hidden;flex:none}
.who .ph svg{display:block;width:100%;height:100%}
.who b{font-weight:500;display:block;line-height:1.3;white-space:nowrap}
.who span{display:block;color:var(--mute);font-size:12px;line-height:1.3;white-space:nowrap}
.ttl{font-weight:500;line-height:1.35}
.ttl small{display:block;font-weight:400;color:var(--mute);font-size:12px}
.foot{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:12.5px;margin-top:10px;gap:12px;flex-wrap:wrap}
.empty{padding:36px 16px;text-align:center;color:var(--mute)}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:14px 16px}
.kpi span{display:block;color:var(--mute);font-size:12.5px}
.kpi b{display:block;font-weight:400;font-size:27px;letter-spacing:-.02em;line-height:1.25;margin-top:4px}
.kpi small{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.kpi small em{font-style:normal;color:var(--good)}
.kpi.attn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line2))}
.kpi.attn b{color:var(--warn)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.card{background:var(--surface);border:1px solid var(--line2);border-radius:14px;padding:16px 18px;min-width:0}
.card h3{margin:0;font-weight:500;font-size:15px}
.card .sub{color:var(--mute);font-size:12.5px;margin-top:2px}
.card .sub{overflow-wrap:anywhere}
.card .hd{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{fill:var(--mute);font-family:var(--font);font-size:11px}
.tip{position:absolute;pointer-events:none;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:12.5px;white-space:nowrap;box-shadow:0 10px 26px rgba(0,0,0,.4);z-index:5;transform:translate(-50%,-100%)}
.tip b{font-weight:600}
.tip span{display:block;color:var(--mute);font-size:11.5px}
.hbars{display:flex;flex-direction:column;gap:9px;margin-top:4px}
.hb{display:grid;grid-template-columns:96px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:13px;position:relative}
.hb .trk{height:14px;position:relative}
.hb .fill{position:absolute;left:0;top:0;bottom:0;background:var(--violet);border-radius:0 4px 4px 0;transition:width .35s}
.hb:hover .fill{filter:brightness(1.15)}
.hb .v{text-align:right;color:var(--soft)}
.attn-list{display:flex;flex-direction:column}
.al{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line2)}
.al:first-child{border-top:0}
.al .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;flex:none;background:var(--raise)}
.al .ic svg{width:16px;height:16px}
.al .tx{flex:1;min-width:0;font-size:13.5px}
.al .tx span{display:block;color:var(--mute);font-size:12.5px}
.row3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.mini{display:flex;flex-direction:column;gap:2px}
.mini b{font-weight:400;font-size:22px}
.mini span{color:var(--mute);font-size:12.5px}

/* drawer */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(6,9,26,.55)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:71;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:-20px 0 50px rgba(0,0,0,.4);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:dIn .22s ease-out}
@keyframes dIn{from{transform:translateX(30px);opacity:0}}
.dh{display:flex;align-items:center;gap:12px;padding:14px 18px;padding-right:max(18px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line2)}
.dh h2{flex:1;margin:0;font-weight:500;font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{width:34px;height:34px;border:0;border-radius:9px;background:none;color:var(--mute);font-size:16px;display:grid;place-items:center;flex:none}
.x:hover{background:var(--raise);color:var(--fg)}
.db{flex:1;overflow-y:auto;padding:18px;padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
.df{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 18px;padding-right:max(18px,env(safe-area-inset-right,0px));border-top:1px solid var(--line2)}
.df .sp{flex:1}
.prof{display:flex;gap:14px;align-items:center}
.prof .ph{width:60px;height:60px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--line)}
.prof .ph svg{display:block;width:100%;height:100%}
.prof b{font-weight:500;font-size:18px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.prof span{color:var(--mute);font-size:13px;display:block}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{background:var(--raise);border-radius:10px;padding:9px 10px}
.stats b{display:block;font-weight:500;font-size:16px}
.stats span{color:var(--mute);font-size:11.5px}
.sec h4{margin:0 0 8px;font-weight:500;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--mute)}
.fld input,.fld select,.fld textarea{height:38px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 11px;font-size:14px;color:var(--fg);outline:none;width:100%}
.fld textarea{height:auto;min-height:76px;padding:9px 11px;resize:vertical;line-height:1.45}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--teal)}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fgrid .full{grid-column:1/-1}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line2);font-size:13.5px}
.li:first-child{border-top:0}
.li .tx{flex:1;min-width:0}
.li .tx span{display:block;color:var(--mute);font-size:12px}
.note{display:flex;gap:10px;padding:11px 13px;border-radius:12px;background:var(--raise);color:var(--soft);font-size:12.5px;line-height:1.45}
.note svg{flex:none;width:17px;height:17px;color:var(--teal);margin-top:1px}
.note.warn svg{color:var(--warn)}
.sw{display:flex;align-items:center;gap:12px;cursor:pointer;font-size:13.5px}
.sw input{appearance:none;-webkit-appearance:none;width:40px;height:23px;border-radius:12px;background:var(--line);position:relative;cursor:pointer;transition:.2s;margin:0;flex:none}
.sw input::after{content:"";position:absolute;left:3px;top:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked{background:var(--teal)}.sw input:checked::after{left:20px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid transparent;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.swatches button[aria-pressed=true]{border-color:var(--fg);box-shadow:0 0 0 2px var(--surface) inset}

/* conversations */
.conv{display:grid;grid-template-columns:300px minmax(0,1fr);border:1px solid var(--line2);border-radius:14px;background:var(--surface);min-height:560px;overflow:hidden}
.cl{border-right:1px solid var(--line2);display:flex;flex-direction:column;min-width:0}
.cl .fsearch{margin:12px;width:auto}
.cl ul{list-style:none;margin:0;padding:0 6px 8px;overflow-y:auto;max-height:620px}
.cl li{padding:10px;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.cl li:hover{background:var(--raise)}
.cl li[aria-selected=true]{background:var(--raise);box-shadow:inset 3px 0 0 var(--teal)}
.cl li b{font-weight:500;font-size:13.5px;line-height:1.35}
.cl li span{color:var(--mute);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cv{display:flex;flex-direction:column;min-width:0}
.cvh{padding:14px 18px;border-bottom:1px solid var(--line2);display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.cvh .tx{flex:1;min-width:200px}
.cvh h3{margin:0;font-weight:500;font-size:16px}
.cvh .m{color:var(--mute);font-size:12.5px;display:flex;gap:12px;flex-wrap:wrap;margin-top:3px}
.cvt{display:flex;gap:20px;padding:0 18px;border-bottom:1px solid var(--line2)}
.cvt button{background:none;border:0;padding:11px 0;color:var(--mute);font-weight:500;font-size:13.5px;border-bottom:2px solid transparent;margin-bottom:-1px}
.cvt button[aria-pressed=true]{color:var(--fg);border-bottom-color:var(--teal)}
.cvb{padding:14px 18px 20px;overflow-y:auto;max-height:560px;display:flex;flex-direction:column;gap:2px}
.ln{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;padding:8px 8px;border-radius:10px;align-items:start}
.ln:hover{background:var(--raise)}
.ln time{color:var(--mute);font-size:11.5px;padding-top:2px}
.ln b{font-weight:500;font-size:13px;color:var(--gold)}
.ln p{margin:1px 0 0;font-size:13.5px;line-height:1.5;color:var(--fg)}
.ln .rm{opacity:0;border:0;background:none;color:var(--mute);font-size:12px;padding:2px 6px;border-radius:6px}
.ln:hover .rm,.ln .rm:focus-visible{opacity:1}
@media (hover:none){.ln .rm{opacity:1}}
.ln .rm:hover{color:var(--bad);background:rgba(255,107,122,.1)}
.ln.gone p{color:var(--mute);font-style:italic}
.ln.flag{box-shadow:inset 3px 0 0 var(--warn)}
.audit{display:flex;gap:8px;align-items:center;color:var(--mute);font-size:12px;padding:10px 18px;border-top:1px solid var(--line2);margin-top:auto}
.audit svg{width:14px;height:14px;flex:none}

/* export */
.ex{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px;align-items:start}
.chk{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line2);cursor:pointer}
.chk:first-of-type{border-top:0}
.chk input{width:18px;height:18px;accent-color:var(--teal);margin:0;flex:none}
.chk .tx{flex:1;min-width:0}
.chk .tx span{display:block;color:var(--mute);font-size:12.5px}
.chk em{font-style:normal;color:var(--mute);font-size:12.5px}
.fmts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.fmt{border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:none;text-align:left;display:flex;flex-direction:column;gap:3px}

function lineChart(el,data,{label,unit,step,aria}){
  const W=Math.max(el.clientWidth,280),H=230,pl=44,pr=10,pt=10,pb=26;
  const raw=Math.max(...data);const mag=Math.pow(10,Math.floor(Math.log10(raw)));const stepV=[1,2,2.5,5,10].map(s=>s*mag/2).find(s=>raw/s<=4.2)||mag;
  const max=Math.ceil(raw/stepV)*stepV;const x=i=>pl+(W-pl-pr)*(data.length===1?0:i/(data.length-1));const y=v=>pt+(H-pt-pb)*(1-v/max);
  const ticks=[];for(let v=0;v<=max+1e-9;v+=stepV)ticks.push(v);
  const short=v=>v>=10000?(v/1000).toFixed(v%1000?1:0)+'k':fmt(v);
  const pts=data.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`);const last=data.length-1;
  const xl=[];for(let i=last;i>=0;i-=step)xl.push(i);
  const gid='g'+Math.random().toString(36).slice(2,7);
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" height="${H}" role="img" aria-label="${esc(aria)}">
   <defs><linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17C3C8" stop-opacity=".28"/><stop offset="1" stop-color="#17C3C8" stop-opacity="0"/></linearGradient></defs>
   ${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#3A4175" stroke-opacity="${v===0?1:.45}" stroke-width="1"/><text x="${pl-8}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`).join('')}
   ${xl.map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="${i===last?'end':i===0?'start':'middle'}">${label(i)}</text>`).join('')}
   <path d="M${pts.join('L')}L${x(last)},${y(0)}L${x(0)},${y(0)}Z" fill="url(#${gid})"/>
   <polyline points="${pts.join(' ')}" fill="none" stroke="#17C3C8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
   <circle cx="${x(last)}" cy="${y(data[last])}" r="4.5" fill="#17C3C8" stroke="#20264A" stroke-width="2"/>
   <line class="xh" y1="${pt}" y2="${H-pb}" stroke="#A9B0D6" stroke-width="1" stroke-dasharray="3 3" visibility="hidden"/>
   <circle class="xd" r="5" fill="#17C3C8" stroke="#20264A" stroke-width="2" visibility="hidden"/>
   <rect x="${pl}" y="0" width="${W-pl-pr}" height="${H-pb}" fill="transparent" class="hov"/>
  </svg><div class="tip" hidden></div>`;
  const hov=el.querySelector('.hov'),xh=el.querySelector('.xh'),xd=el.querySelector('.xd'),tip=el.querySelector('.tip');
  const move=ev=>{const r=el.querySelector('svg').getBoundingClientRect();const px=(ev.clientX-r.left)*(W/r.width);const i=Math.max(0,Math.min(last,Math.round((px-pl)/((W-pl-pr)/Math.max(1,last)))));
    xh.setAttribute('x1',x(i));xh.setAttribute('x2',x(i));xh.setAttribute('visibility','visible');xd.setAttribute('cx',x(i));xd.setAttribute('cy',y(data[i]));xd.setAttribute('visibility','visible');
    tip.hidden=false;tip.innerHTML=`<b class="num">${fmt(data[i])}</b> ${unit}<span>${label(i)}</span>`;
    const sx=x(i)*r.width/W;tip.style.left=Math.max(60,Math.min(r.width-60,sx))+'px';tip.style.top=(y(data[i])*r.height/H-10)+'px'};
  hov.addEventListener('pointermove',move);hov.addEventListener('pointerdown',move);
  hov.addEventListener('pointerleave',()=>{xh.setAttribute('visibility','hidden');xd.setAttribute('visibility','hidden');tip.hidden=true});
}

  openDrawer(u.name,`
   <div class="prof"><span class="ph">${av(u)}</span><div><b>${esc(u.name)} ${roleChip(u.role)} ${u.trusted?TRUST:''}</b><span>${esc(u.city)} · joined ${u.joined}</span><span>Last active ${u.last}</span></div></div>
   ${u.status==='suspended'?`<div class="note warn">${ic('flag')}<div><b>Suspended.</b> They can't join or host tables, chat or tip. Their profile is hidden. Reported ${u.reports} times.</div></div>`:u.reports?`<div class="note warn">${ic('flag')}<div><b>Reported ${u.reports===1?'once':u.reports+' times'}.</b> Latest: "Interrupts people and won't stop", at "Is the universe a computer?".</div></div>`:''}

     <label class="fld full">Bio<textarea id="ef-bio" maxlength="160">${esc(u.bio)}</textarea></label>
     <div class="fld full">Talks about<div class="pills" id="ef-tp">${TOPICS.map(t=>`<button type="button" class="pill" aria-pressed="${u.topics.includes(t.id)}" data-t="${t.id}"><i style="background:${t.color}"></i>${esc(t.name)}</button>`).join('')}</div></div>
     <label class="sw full"><input type="checkbox" id="ef-trust" ${u.trusted?'checked':''}>Trusted host tag</label>
   </div></div>
   <div class="sec"><h4>Tables they host</h4><div class="list">${hostedT.length?hostedT.map(t=>`<div class="li"><div class="tx">${esc(t.title)}<span>${tpTag(t.topic)} · ${t.when}</span></div>${tStatus(t)}</div>`).join(''):'<div class="m" style="color:var(--mute)">None right now.</div>'}</div></div>
   <div class="sec"><h4>Admin access</h4><div class="li" style="border:0;padding:0"><div class="tx">${u.role==='member'?'No admin access.':u.role==='admin'?'Admin: full access, including delete and export.':'Support: can view and edit, can\'t delete or export.'}</div>${u.role==='member'?`<button class="btn sm" data-a="grant">Make admin</button>`:`<button class="btn sm redo" data-a="revoke">Remove access</button>`}</div></div>
   <div class="sec" style="display:flex;gap:18px;flex-wrap:wrap"><a class="lnk" href="../profile/timecapsule-profile.html" target="_top">View public profile</a><button class="lnk" data-a="chats">Read their direct chats</button></div>`,
   `<button class="btn pri" data-a="save">Save changes</button><span class="sp"></span>${u.status==='suspended'?'<button class="btn" data-a="restore">Lift suspension</button>':'<button class="btn" data-a="suspend">Suspend</button>'}<button class="btn redo" data-a="delete">Delete user</button>`);
  $('#ef-tp').onclick=e=>{const b=e.target.closest('[data-t]');if(b)b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true')};
  $('#drawer').onclick=e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
    if(a==='save'){u.name=$('#ef-name').value.trim()||u.name;u.city=$('#ef-city').value.trim();u.email=$('#ef-email').value.trim();u.bio=$('#ef-bio').value;u.topics=[...$('#ef-tp').querySelectorAll('[aria-pressed=true]')].map(x=>x.dataset.t);u.trusted=$('#ef-trust').checked;logAction(`edited ${u.name}'s profile`);closeDrawer();refresh();toast(`Saved ${u.name}'s profile`)}
    if(a==='chats'){convKind='direct';cQuery=u.name;closeDrawer();if(cur==='conversations')VIEWS.conversations();else location.hash='conversations';return}
    if(a==='grant')grantAdmin(u);

    if(a==='restore'){u.status='active';u.reports=0;logAction(`lifted ${u.name}'s suspension`);closeDrawer();refresh();toast(`${u.name} can use TimeCapsule again`)}
    if(a==='delete')confirmBox({title:`Delete ${u.name}?`,body:`<p>This removes them for good and can't be undone:</p><ul><li>Profile, notes, chats and saved tables.</li><li>${hostedT.length} upcoming tables they host are cancelled and guests are told.</li><li>Their lines in kept transcripts show as "A former member".</li></ul><label class="fld">Type <b style="color:var(--fg)">${esc(u.name)}</b> to confirm<input data-need autocomplete="off"></label>`,yes:'Delete user',needs:u.name,fn:()=>{const i=USERS.indexOf(u);USERS.splice(i,1);logAction(`deleted the user ${u.name}`);closeDrawer();refresh();toast(`${u.name} was deleted`)}});
  };
}
function grantAdmin(u){
  confirmBox({title:`Give ${u.name} admin access?`,body:`<p>Choose what ${esc(u.name)} can do. They get an email and see "Admin" in their avatar menu.</p><div class="list" style="margin-top:10px" id="rolepick"><label class="chk"><input type="radio" name="rl" value="support" checked><div class="tx">Support<span>See users, tables and conversations. Edit profiles and tables. Can't delete, export or change admins.</span></div></label><label class="chk"><input type="radio" name="rl" value="admin"><div class="tx">Admin<span>Everything, including delete, export and giving admin access to others.</span></div></label></div>`,yes:'Give access',cls:'pri',fn:()=>{const r=document.querySelector('input[name=rl]:checked').value;u.role=r;logAction(`granted ${r==='admin'?'Admin':'Support'} access to ${u.name}`);closeDrawer();refresh();toast(`${u.name} is now ${r==='admin'?'an Admin':'Support'}`)}});
}
function revokeAdmin(u){
  confirmBox({title:`Remove ${u.name}'s admin access?`,body:`<p>${esc(u.name)} stays a member and keeps their tables and profile. They lose access to this panel straight away.</p>`,yes:'Remove access',fn:()=>{const old=u.role;u.role='member';logAction(`removed ${u.name}'s admin access`);closeDrawer();refresh();toast(`${u.name} is no longer an admin`,()=>{u.role=old;refresh()})}});
}
const refresh=()=>{drawNav(cur);VIEWS[cur]()};

/* ---------- Tables ---------- */
let tFilter='upcoming',tQuery='';
const tStatus=t=>t.status==='live'?'<span class="st live">Live</span>':t.status==='scheduled'?'<span class="st teal">Scheduled</span>':t.status==='cancelled'?'<span class="st bad">Cancelled</span>':'<span class="st">Ended</span>';
VIEWS.tables=function(){
  M().innerHTML=`<div class="page">${head('Tables','Every table, open and private.')}
  <div class="bar"><div style="display:flex;gap:6px;flex-wrap:wrap" id="tf">${[['upcoming','Live and upcoming'],['past','Past'],['cancelled','Cancelled'],['all','All']].map(([k,l])=>`<button class="day" aria-pressed="${tFilter===k}" data-f="${k}">${l}</button>`).join('')}</div><span class="sp"></span><select class="sel" id="ttp" aria-label="Topic"><option value="">All topics</option>${TOPICS.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select><input class="fsearch" id="tq" type="search" placeholder="Title or host" aria-label="Find a table" value="${esc(tQuery)}"></div>
  <div class="tw"><table class="dt"><thead><tr><th>Table</th><th class="hide-s">Host</th><th>When</th><th class="r hide-s">Chairs</th><th class="hide-s">Who can join</th><th>Status</th></tr></thead><tbody id="tb"></tbody></table></div>
  <div class="foot"><span id="tcount"></span><span>Open a table to edit it, read its conversation or delete it.</span></div></div>`;
  $('#tf').onclick=e=>{const b=e.target.closest('[data-f]');if(!b)return;tFilter=b.dataset.f;VIEWS.tables()};
  $('#tq').oninput=e=>{tQuery=e.target.value;drawTables()};$('#ttp').onchange=drawTables;
  drawTables();
};
function drawTables(){
  const q=tQuery.trim().toLowerCase(),tp=$('#ttp').value;
  const list=TABLES.filter(t=>(tFilter==='all'||(tFilter==='upcoming'&&(t.status==='live'||t.status==='scheduled'))||(tFilter==='past'&&t.status==='ended')||(tFilter==='cancelled'&&t.status==='cancelled'))&&(!tp||t.topic===tp)&&(!q||(t.title+' '+uById(t.host)?.name).toLowerCase().includes(q)));
  $('#tb').innerHTML=list.length?list.map(t=>{const h=uById(t.host)||{name:'A former member'};return `<tr data-id="${t.id}" tabindex="0"><td><div class="ttl">${esc(t.title)}<small>${tpTag(t.topic)}</small></div></td><td class="hide-s">${h.look?`<div class="who"><span class="ph">${av(h)}</span><b>${esc(h.name)}</b></div>`:esc(h.name)}</td><td class="num" style="white-space:nowrap">${t.when}</td><td class="r num hide-s">${t.taken}/${t.seats}</td><td class="hide-s m">${t.vis==='open'?'Open':'Private'}</td><td>${tStatus(t)}</td></tr>`}).join(''):`<tr><td colspan="6"><div class="empty">No tables match.</div></td></tr>`;
  $('#tcount').textContent=`${list.length} shown`;
  bindRows('#tb',openTable);
}
function openTable(id){
  const t=tById(id);if(!t)return;const h=uById(t.host)||{name:'A former member'};
  const guests=USERS.filter(u=>u.id!==t.host).slice(3,3+Math.min(t.taken,6));
  const hasConv=TRANSCRIPTS[t.id]||t.msgs;
  openDrawer('Table',`
   <div><div class="ttl" style="font-size:17px">${esc(t.title)}</div><div style="display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;color:var(--mute);font-size:13px">${tStatus(t)}<span>Hosted by ${esc(h.name)}</span><span class="num">${t.taken} of ${t.seats} chairs taken</span></div></div>
   ${t.status==='live'?`<div class="note">${ic('info')}<div>This table is live. Changes to time and chairs apply to the next session only.</div></div>`:''}
   <div class="sec"><h4>Details</h4><div class="fgrid">
    <label class="fld full">Title<input id="tf-title" value="${esc(t.title)}" maxlength="80"></label>
    <label class="fld">Topic<select id="tf-topic">${TOPICS.map(x=>`<option value="${x.id}" ${x.id===t.topic?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
    <label class="fld">When<input id="tf-when" value="${esc(t.when)}"></label>
    <label class="fld">Chairs<input id="tf-seats" type="number" min="3" max="12" value="${t.seats}"></label>
    
    <label class="fld full">Who can join<select id="tf-vis"><option value="open" ${t.vis==='open'?'selected':''}>Open: anyone can find it on the Tables page</option><option value="private" ${t.vis==='private'?'selected':''}>Private: only people with the link</option></select></label>
   </div></div>
   <div class="sec"><h4>At the table</h4><div class="list">${[h].concat(guests).filter(p=>p.look).map((p,i)=>`<div class="li"><span class="who"><span class="ph">${av(p)}</span></span><div class="tx">${esc(p.name)}<span>${i===0?'Host':'Guest'} · ${esc(p.city)}</span></div><button class="lnk" data-user="${p.id}">Open</button></div>`).join('')}</div></div>
   <div class="sec"><h4>Conversation</h4>${hasConv?`<div class="li" style="border:0;padding:0"><div class="tx">${TRANSCRIPTS[t.id]?'Transcript kept':'No transcript'} · ${t.msgs} messages</div><a class="btn sm" href="#conversations-${t.id}">Read conversation</a></div>`:'<div style="color:var(--mute)">Nothing yet. It starts when the table does.</div>'}</div>`,
   `<button class="btn pri" data-a="save">Save changes</button><span class="sp"></span>${t.status==='scheduled'?'<button class="btn" data-a="cancel">Cancel table</button>':''}<button class="btn redo" data-a="delete">Delete table</button>`);
  $('#drawer').onclick=e=>{const u=e.target.closest('[data-user]');if(u){openUser(u.dataset.user);return}const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
   if(a==='save'){t.title=$('#tf-title').value.trim()||t.title;t.topic=$('#tf-topic').value;t.when=$('#tf-when').value;t.seats=Math.max(t.taken,+$('#tf-seats').value||t.seats);t.vis=$('#tf-vis').value;logAction(`edited the table "${t.title}"`);closeDrawer();refresh();toast('Table saved. Guests see the change.')}
   if(a==='cancel')confirmBox({title:'Cancel this table?',body:`<p>"${esc(t.title)}" stays in the records as cancelled. ${t.taken} guests get a notification and an email.</p>`,yes:'Cancel table',fn:()=>{const old=t.status;t.status='cancelled';logAction(`cancelled "${t.title}"`);closeDrawer();refresh();toast('Table cancelled',()=>{t.status=old;refresh()})}});
   if(a==='delete')confirmBox({title:'Delete this table?',body:`<p>This can't be undone:</p><ul><li>"${esc(t.title)}" disappears from the Tables page, profiles and My tables.</li><li>Its transcript, messages, ratings and tips are deleted.</li>${t.status!=='ended'?`<li>${t.taken} guests are told it was cancelled.</li>`:''}</ul><p>To keep the records, cancel it instead.</p>`,yes:'Delete table',fn:()=>{TABLES.splice(TABLES.indexOf(t),1);logAction(`deleted the table "${t.title}"`);closeDrawer();refresh();toast('Table deleted')}});
  };
}

VIEWS.conversations=function(){
  const nT=TABLES.filter(t=>TRANSCRIPTS[t.id]||CHATS[t.id]).length;
  M().innerHTML=`<div class="page">${head('Conversations','What members said at tables, and to each other in chats.')}
  <div class="cvt" style="padding:0;margin-bottom:16px" id="ckind"><button aria-pressed="${convKind==='tables'}" data-k="tables">At tables <span class="m num">${nT}</span></button><button aria-pressed="${convKind==='direct'}" data-k="direct">Direct chats <span class="m num">${DMS.length}</span>${DMS.some(d=>d.reported)?' <span class="st warn" style="margin-left:4px"></span>':''}</button></div>
  <div class="conv"><div class="cl"><input class="fsearch" id="cq" type="search" placeholder="${convKind==='tables'?'Find a table or person':'Find a person'}" aria-label="Find a conversation" value="${esc(cQuery)}"><ul id="clist" role="listbox" aria-label="Conversations"></ul></div><div class="cv" id="cv"></div></div></div>`;
  $('#ckind').onclick=e=>{const b=e.target.closest('[data-k]');if(!b)return;convKind=b.dataset.k;history.replaceState(null,'','#conversations');VIEWS.conversations()};
  $('#cq').oninput=e=>{cQuery=e.target.value;drawCList()};

const pname=id=>uById(id)?.name||'A former member';
function drawCList(){
  const q=cQuery.trim().toLowerCase();let list;
  if(convKind==='tables'){
    list=TABLES.filter(t=>(TRANSCRIPTS[t.id]||CHATS[t.id])&&(!q||t.title.toLowerCase().includes(q)||[...(TRANSCRIPTS[t.id]||[]),...(CHATS[t.id]||[])].some(l=>l[1].toLowerCase().includes(q))||pname(t.host).toLowerCase().includes(q)));
    if(list.length&&!list.find(t=>t.id===selConv))selConv=list[0].id;
    $('#clist').innerHTML=list.map(t=>`<li role="option" tabindex="0" aria-selected="${t.id===selConv}" data-id="${t.id}"><b>${esc(t.title)}</b><span>${tpTag(t.topic)}<span>${t.when}</span>${t.reports?'<span class="st warn">Reported</span>':''}</span></li>`).join('')||'<li style="cursor:default;color:var(--mute)">No conversations match.</li>';
  }else{
    list=DMS.filter(d=>!q||(pname(d.a)+' '+pname(d.b)).toLowerCase().includes(q));
    if(list.length&&!list.find(d=>d.id===selDm))selDm=list[0].id;
    $('#clist').innerHTML=list.map(d=>{const A=uById(d.a),B=uById(d.b);const last=d.msgs[d.msgs.length-1];return `<li role="option" tabindex="0" aria-selected="${d.id===selDm}" data-id="${d.id}"><div class="dmh"><span class="pair">${A?`<span class="ph">${av(A)}</span>`:''}${B?`<span class="ph">${av(B)}</span>`:''}</span><b>${esc(pname(d.a))} and ${esc(pname(d.b))}</b></div><span><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%">${esc(last[2])}</span></span><span><span>${last[0]}</span>${d.reported?'<span class="st warn">Reported</span>':''}${d.blocked?'<span class="st bad">Blocked</span>':''}</span></li>`}).join('')||'<li style="cursor:default;color:var(--mute)">No chats with that person.</li>';
  }
  const go=e=>{const li=e.target.closest('[data-id]');if(!li)return;if(convKind==='tables')selConv=li.dataset.id;else selDm=li.dataset.id;history.replaceState(null,'','#conversations-'+li.dataset.id);drawCList();if(innerWidth<=860)$('#cv').scrollIntoView({behavior:'smooth'})};
  $('#clist').onclick=go;$('#clist').onkeydown=e=>{if(e.key==='Enter')go(e)};
  if(!list.length){$('#cv').innerHTML='<div class="empty">Nothing matches your search.</div>';return}
  convKind==='tables'?drawConv():drawDm();
}
function drawDm(){
  const d=DMS.find(x=>x.id===selDm);const A=uById(d.a),B=uById(d.b);
  $('#cv').innerHTML=`<div class="cvh"><div class="tx"><h3>${esc(pname(d.a))} and ${esc(pname(d.b))}</h3><div class="m"><span>Chatting since ${d.started}</span><span>Met at "${esc(d.met)}"</span><span class="num">${d.msgs.length} messages</span></div></div>${A?`<button class="btn sm" data-user="${A.id}">${esc(A.name)}</button>`:''}${B?`<button class="btn sm" data-user="${B.id}">${esc(B.name)}</button>`:''}</div>
   ${d.reported?`<div class="note warn" style="margin:12px 18px 0">${ic('flag')}<div><b>${esc(pname(d.b))} reported this chat:</b> "Making me feel unsafe or followed". ${d.blocked?esc(d.blocked)+'.':''}</div></div>`:''}
   <div class="cvb dm">${d.msgs.map((m,i)=>{const who=m[1]==='a'?d.a:d.b;const prev=d.msgs[i-1];const showName=!prev||prev[1]!==m[1];return `<div class="bub ${m[1]==='b'?'r':''} ${m.gone?'gone':''} ${m[3]&&!m.gone?'flag':''}">${showName?`<small>${esc(pname(who))} · ${m[0]}</small>`:''}<div class="bb"><p>${m.gone?'Removed by an admin':esc(m[2])}</p>${m.gone?'':`<button class="rm" data-rm="${i}">Remove</button>`}</div></div>`}).join('')}</div>
   <div class="audit">${ic('eye')}<span>Opening a chat is recorded in the admin activity log. Members are not told.</span></div>`;
  $('#cv').onclick=e=>{const u=e.target.closest('[data-user]');if(u){openUser(u.dataset.user);return}const b=e.target.closest('[data-rm]');if(!b)return;const m=d.msgs[+b.dataset.rm];
    confirmBox({title:'Remove this message?',body:`<p>"${esc(m[2])}"</p><p>Both people see "Removed by an admin" instead. ${esc(pname(m[1]==='a'?d.a:d.b))} is not told who removed it.</p>`,yes:'Remove',fn:()=>{m.gone=true;logAction(`removed a message in the chat between ${pname(d.a)} and ${pname(d.b)}`);drawDm();toast('Message removed',()=>{m.gone=false;drawDm()})}})};
  if(!d._viewed){d._viewed=true;logAction(`opened the chat between ${pname(d.a)} and ${pname(d.b)}`)}
}
function drawConv(){
  const t=tById(selConv);if(!t){$('#cv').innerHTML='<div class="empty">Pick a table on the left.</div>';return}
  const h=uById(t.host)||{name:'A former member'};const tr=TRANSCRIPTS[t.id]||[],ch=CHATS[t.id]||[];
  if(convTab==='transcript'&&!tr.length)convTab='messages';
  const lines=convTab==='transcript'?tr:ch;

   if(b.dataset.a==='delete'){const n=TABLES.filter(x=>x.topic===t.id).length;
     confirmBox({title:`Delete ${t.name}?`,body:`<p>Members can no longer pick it. Its tables and profiles move to another topic.</p><label class="fld">Move its tables to<select id="mv">${TOPICS.filter(x=>x.id!==t.id).map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label><p style="color:var(--mute)">To keep it for later, turn off "Show this topic to members" instead.</p>`,yes:'Delete topic',fn:()=>{const to=$('#mv').value;TABLES.forEach(x=>{if(x.topic===t.id)x.topic=to});USERS.forEach(u=>{u.topics=u.topics.filter(z=>z!==t.id)});TOPICS.splice(TOPICS.indexOf(t),1);logAction(`deleted the topic ${t.name}`);closeDrawer();refresh();toast(`${t.name} deleted. Its tables moved to ${topic(to).name}.`)}});}

};

   <div style="color:var(--mute);font-size:12px">You can use: ${Object.keys(ex).map(k=>`<code style="color:var(--soft)">{${k}}</code>`).join(' ')}</div>
   <div class="sec"><h4>Example</h4><div id="snp"></div><div id="tpc" style="font-size:12.5px;margin-top:8px"></div></div>`,
   `<button class="btn pri" data-a="save">Apply to ${fmt(t.count)} pages</button>`);
  const upd=()=>{const ti=fill($('#tp-t').value),de=fill($('#tp-d').value);$('#snp').innerHTML=snippet(id==='tt'?'/topics/philosophy':id==='tb'?'/t/is-free-will-an-illusion':'/@gregory',ti,de);const a=tState(ti,30,60),b=tState(de,70,160);$('#tpc').innerHTML=`Title: <span class="st ${a[0]}">${a[1]} · ${ti.length}</span> &nbsp; Description: <span class="st ${b[0]}">${b[1]} · ${de.length}</span>`};
  upd();$('#tp-t').oninput=upd;$('#tp-d').oninput=upd;
  $('#drawer').onclick=e=>{if(!e.target.closest('[data-a]'))return;confirmBox({title:`Update ${fmt(t.count)} pages?`,body:'<p>Search engines see the new titles and descriptions over the next few days. Rankings can move a little while they do.</p>',yes:'Update pages',cls:'pri',fn:()=>{t.title=$('#tp-t').value;t.desc=$('#tp-d').value;logAction(`changed the ${t.type.toLowerCase()} search template`);closeDrawer();VIEWS.seo();toast(`${fmt(t.count)} pages updated`)}})};
}
function seoSitemap(){
  const S=SITEMAP;const rows=[['home','Home and main pages','Home, Tables, People, World, About','8 URLs',true],['topics','Topic pages','One page per topic shown to members',TOPICS.filter(t=>t.shown).length+' URLs'],['tables','Open table pages','Live and upcoming open tables. Private tables are never included.','1,186 URLs'],['profiles','Host profiles','Only hosts who turned on "Let people find me"','142 URLs'],['transcripts','Public transcripts','Only when everyone at the table agreed to make it public','0 URLs']];
  $('#sbody').innerHTML=`<div class="grid2" style="grid-template-columns:minmax(0,1.2fr) minmax(0,1fr)">
   <div class="card"><div class="hd"><div><h3>Sitemap</h3><div class="sub" style="font-family:ui-monospace,Menlo,monospace">timecapsule.example/sitemap.xml</div></div><span class="st good">Read by Google ${S.generated.toLowerCase()}</span></div>
    <div class="list">${rows.map(([k,l,d,c,fixed])=>`<label class="chk"><div class="tx">${l}<span>${d}</span></div><em class="num">${c}</em><span class="sw"><input type="checkbox" data-sm="${k}" ${S[k]?'checked':''} ${fixed?'disabled':''} aria-label="${l}"></span></label>`).join('')}</div>
    <div class="note" style="margin-top:12px">${ic('shield')}<div>Never in the sitemap or search: private tables, guest lists, chats, notes, kept transcripts that aren't public, and anyone who hasn't turned on "Let people find me".</div></div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;align-items:center"><button class="btn pri" id="regen">Rebuild sitemap</button><button class="btn" id="ping">Tell Google and Bing</button><span style="color:var(--mute);font-size:12.5px" id="smi">${fmt(S.urls)} URLs · rebuilt ${S.generated.toLowerCase()} · rebuilds every night</span></div></div>
   <div class="card"><div class="hd"><div><h3>robots.txt</h3><div class="sub">Tells search engines what they may visit</div></div></div>
    <label class="fld"><textarea id="rb" spellcheck="false" style="font-family:ui-monospace,Menlo,monospace;font-size:12.5px;min-height:200px">${esc(ROBOTS)}</textarea></label>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" id="rbs">Save robots.txt</button></div></div></div>`;
  $('#sbody').querySelectorAll('[data-sm]').forEach(c=>c.onchange=()=>{S[c.dataset.sm]=c.checked;toast(`${c.closest('label').querySelector('.tx').firstChild.textContent} ${c.checked?'added to':'removed from'} the sitemap from the next rebuild`)});
  $('#regen').onclick=()=>{S.generated='Just now';S.urls=8+(S.topics?TOPICS.length:0)+(S.tables?1186:0)+(S.profiles?142:0);logAction('rebuilt the sitemap');seoSitemap();toast(`Sitemap rebuilt with ${fmt(S.urls)} URLs`)};
  $('#ping').onclick=()=>toast('Google and Bing were told the sitemap changed');
  $('#rbs').onclick=()=>{const v=$('#rb').value;const save=()=>{ROBOTS=v;logAction('edited robots.txt');toast('robots.txt saved')};
    if(/^\s*Disallow:\s*\/\s*$/m.test(v))confirmBox({title:'Hide the whole site from search?',body:'<p>"Disallow: /" tells search engines to stop visiting every page. TimeCapsule would drop out of Google within days and lose about 12,000 visits a month.</p>',yes:'Save anyway',fn:save});else save()};
}
let rzG;addEventListener('resize',()=>{clearTimeout(rzG);rzG=setTimeout(()=>{if(cur==='seo'&&sTab==='overview'&&$('#sch'))seoOverview()},150)});

/* ---------- global search ---------- */
$('#gq').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const q=e.target.value.trim().toLowerCase();if(!q)return;
  const u=USERS.find(x=>(x.name+' '+x.email).toLowerCase().includes(q));const t=TABLES.find(x=>x.title.toLowerCase().includes(q));
  if(u){uQuery=e.target.value;uFilter='all';location.hash='users';if(cur==='users')VIEWS.users()}else if(t){tQuery=e.target.value;tFilter='all';location.hash='tables';if(cur==='tables')VIEWS.tables()}else toast(`Nothing found for "${e.target.value}"`)});

$('#meph').innerHTML=av(GABRIELE);
route();
</script>
