<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600&display=swap">
<style>
/* Layout: an evening agenda. Live tables are physical objects (round tables you can see people at); everything later reads as a calm schedule grouped by day. */
:root{
  --bg:#1B2144; --surface:#20264A; --raise:#252B52; --line:#3A4175;
  --fg:#EEF1FF; --mute:#A9B0D6; --soft:#C9CFF0;
  --lamp:#17C3C8; --lamp-ink:#0E1430; --lamp-text:#F2C14E; --violet:#7C5CFF;
  --live:#3DDC84; --live-soft:rgba(61,220,132,.12);
  --shadow:0 18px 40px rgba(5,8,25,.4);
  --display:"Sora",ui-sans-serif,system-ui,sans-serif;
  --body:"Sora",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--lamp);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:20px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:400;font-size:22px;letter-spacing:-.5px;white-space:nowrap}
.logo svg{width:38px;height:28px}
.search{flex:1;max-width:420px;margin-left:auto;position:relative}
.search input{width:100%;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--surface);padding:0 16px 0 40px;font-size:14.5px;outline:none}
.search input:focus{border-color:var(--mute)}
.search svg{position:absolute;left:14px;top:12px;width:16px;height:16px;color:var(--mute)}
.create{height:40px;padding:0 18px;border-radius:10px;border:0;background:var(--violet);color:#fff;box-shadow:0 6px 20px rgba(124,92,255,.35);font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
.create:hover{filter:brightness(1.06)}
.me{width:38px;height:38px;border-radius:50%;overflow:hidden;flex:none}
.me svg{width:100%;height:100%;display:block}

/* hero */
.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 32px;flex-wrap:wrap;padding-block:36px 22px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(32px,4.6vw,48px);line-height:1.05;letter-spacing:-.04em;margin:0;text-wrap:balance}
.hero p{margin:12px 0 0;color:var(--mute);font-size:17px;max-width:520px}
.pulse{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 12px;border-radius:999px;background:var(--live-soft);border:1px solid color-mix(in srgb,var(--live) 35%,transparent);font-size:14px;white-space:nowrap}
.pulse b{color:var(--live);font-weight:600}
.dot{width:9px;height:9px;border-radius:50%;background:var(--live);box-shadow:0 0 0 0 var(--live);animation:beat 1.8s infinite}
@keyframes beat{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--live) 60%,transparent)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.faces{display:flex}.faces span{width:24px;height:24px;border-radius:50%;overflow:hidden;border:2px solid var(--bg);margin-left:-7px}.faces span:first-child{margin-left:0}.faces svg{width:100%;height:100%;display:block}

/* day strip + topics */
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 64px);z-index:15;background:var(--bg);padding-block:10px 12px;border-bottom:1px solid var(--line)}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.days::-webkit-scrollbar,.topics::-webkit-scrollbar{display:none}
.day{flex:none;display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-width:84px;padding:8px 14px;border-radius:12px;border:1px solid transparent;background:none;text-align:left}
.day b{font-weight:600;font-size:14.5px;white-space:nowrap}
.day span{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.day:hover{background:var(--surface)}
.day[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.day[aria-pressed="true"] span{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.day.now b{display:flex;align-items:center;gap:7px}.day.now b::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live)}
.day:disabled{opacity:.4;cursor:default}.day:disabled:hover{background:none}
.row2{display:flex;align-items:center;gap:12px;margin-top:10px}
.topics{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.tp{flex:none;display:flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:none;font-size:13.5px;color:var(--soft)}
.tp i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tp:hover{border-color:var(--mute)}
.tp[aria-pressed="true"]{background:var(--raise);border-color:var(--fg);color:var(--fg)}
.lang{flex:none;height:32px;border-radius:16px;border:1px solid var(--line);background:var(--surface);padding:0 10px;font-size:13.5px}

/* sections */
main{padding-block:8px 80px}
.sec{margin-top:34px}
.sh{display:flex;align-items:baseline;gap:12px;margin:0 0 14px}
.sh h2{font-family:var(--display);font-weight:500;font-size:24px;letter-spacing:-.02em;margin:0}
.sh span{color:var(--mute);font-size:14px}
.sh .lv{color:var(--live);display:flex;align-items:center;gap:8px}

/* live tables: physical objects */
.live{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.tbl{display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;align-items:center;padding:18px;border-radius:22px;background:var(--surface);border:1px solid var(--line);position:relative;transition:border-color .15s,transform .15s}

.ring{position:relative;width:150px;height:150px}
.board{position:absolute;inset:30px;border-radius:50%;overflow:hidden;background:var(--c);background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 70%,#fff 0%),color-mix(in srgb,var(--c) 35%,var(--bg)));display:grid;place-items:center;box-shadow:inset 0 0 0 3px color-mix(in srgb,var(--c) 40%,transparent)}
.board img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ticon{width:42%;height:42%;fill:none;stroke:#fff;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;opacity:.9;filter:drop-shadow(0 1px 4px rgba(0,0,0,.3))}
.board b{position:relative;font-family:var(--display);font-size:22px;font-weight:500;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.5);font-variant-numeric:tabular-nums;line-height:1;text-align:center}
.board b small{display:block;font-family:var(--body);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin-top:3px}
.board.photo::after{content:"";position:absolute;inset:0;background:rgba(10,6,16,.35)}
.seat{position:absolute;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;overflow:hidden;border:2px solid var(--surface)}
.seat svg{width:100%;height:100%;display:block}
.seat.host{box-shadow:0 0 0 2px var(--lamp)}
.seat.open{border:1.5px dashed var(--mute);background:transparent}
.seat.talk{box-shadow:0 0 0 2px var(--live),0 0 12px var(--live)}
.tb{min-width:0;display:flex;flex-direction:column;gap:6px}
.tb h3{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.2;letter-spacing:-.01em;margin:0;text-wrap:balance}
.meta{font-size:13.5px;color:var(--mute)}
.meta b{color:var(--soft);font-weight:600}
.topic{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--soft)}
.topic i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.tbl .topic,.ev .topic{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tf{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:6px}
.left{font-size:13px;color:var(--mute)}
.jbtn{height:38px;padding:0 18px;border-radius:19px;border:0;background:var(--lamp);color:var(--lamp-ink);font-weight:600;white-space:nowrap}
.jbtn:hover{filter:brightness(1.06)}
.jbtn.ghost{background:none;border:1px solid var(--line);color:var(--fg)}
.jbtn.ghost:hover{border-color:var(--fg);filter:none}
.jbtn.on{background:none;border:1px solid var(--lamp);color:var(--lamp-text)}

/* the schedule */
.agenda{border-top:1px solid var(--line)}
.ev{display:grid;grid-template-columns:110px minmax(0,1fr) 210px 150px;gap:20px;align-items:center;padding:16px 4px;border-bottom:1px solid var(--line)}

.tm b{display:block;font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.1}
.tm span{font-size:12.5px;color:var(--lamp-text);font-variant-numeric:tabular-nums}
.ei{min-width:0;display:flex;gap:14px;align-items:center}
.th{flex:none;width:56px;height:56px;border-radius:14px;overflow:hidden;background:radial-gradient(circle at 35% 30%,var(--c),color-mix(in srgb,var(--c) 30%,var(--bg)))}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th{display:grid;place-items:center}.th .ticon{width:50%;height:50%}
.et{min-width:0}
.et h3{font-family:var(--display);font-weight:600;font-size:17px;line-height:1.25;margin:0 0 3px;text-wrap:balance}
.chairs{display:flex;flex-direction:column;gap:6px}
.cs{display:flex;gap:4px}
.cs i{width:10px;height:10px;border-radius:3px;background:var(--fg)}
.cs i.o{background:none;box-shadow:inset 0 0 0 1.5px var(--mute)}
.cs i.y{background:var(--lamp)}
.chairs span{font-size:12.5px;color:var(--mute)}
.full{color:var(--live)}
.ev .jbtn{justify-self:end}
.empty{padding:48px 0;text-align:center;color:var(--mute)}
.empty button{margin-top:12px;background:none;border:0;color:var(--lamp-text);font-weight:600}

/* host invite */
.host-cta{margin-top:40px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:22px 24px;border-radius:22px;border:1px dashed var(--line)}
.host-cta h3{font-family:var(--display);font-weight:600;font-size:19px;margin:0}
.host-cta p{margin:2px 0 0;color:var(--mute);font-size:14px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;font-weight:500;transition:.25s;z-index:40;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:900px){
  .ev{grid-template-columns:86px minmax(0,1fr) auto;grid-template-areas:"t i b" "t c b"}
  .ev .tm{grid-area:t;align-self:start}.ev .ei{grid-area:i}.ev .chairs{grid-area:c;flex-direction:row;align-items:center;gap:10px}.ev .jbtn{grid-area:b}
}
@media (max-width:640px){
  .hd{gap:10px}.search{display:none}.logo span{display:none}.create{margin-left:auto;height:38px;padding:0 14px}
  .hero{padding-block:22px 14px}.hero p{font-size:15.5px}
  .nav{top:calc(env(safe-area-inset-top,0px) + 64px)}
  .live{grid-template-columns:1fr}
  .tbl{grid-template-columns:118px minmax(0,1fr);gap:14px;padding:14px}
  .ring{width:118px;height:118px}.board{inset:24px}.seat{width:24px;height:24px;margin:-12px 0 0 -12px}.board b{font-size:17px}
  .tb h3{font-size:17px}
  .ev{grid-template-columns:62px minmax(0,1fr);grid-template-areas:"t i" "t c" "t b";gap:8px 14px}
  .ev .jbtn{justify-self:start;margin-top:4px}
  .th{width:44px;height:44px;border-radius:11px}
  .tm b{font-size:18px}
  .sh h2{font-size:21px}
}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.tbl{transition:none}}

.navrow{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.nav{padding-block:12px}
.days{flex:1;min-width:0;gap:4px}
.day{min-width:0;flex-direction:row;align-items:center;gap:6px;padding:0 14px;height:36px;border-radius:10px;border:1px solid var(--line);font-size:14px}
.day b{font-weight:500;font-size:14px}
.day:hover{background:none;border-color:var(--mute)}
.day[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.day.now b::before{background:var(--live)}
.day .cnt{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--live-soft);color:var(--live);font-size:12px;font-weight:600;display:grid;place-items:center}
.day[aria-pressed="true"] .cnt{background:var(--live);color:#0B2A1A}
.sels{display:flex;gap:8px}
.lang{height:36px;border-radius:10px;padding:0 12px;font-size:14px;background:var(--raise)}
.tbl{border-color:var(--live)}

.jbtn{border-radius:10px}.jbtn.ghost{border-color:var(--line)}
.create{border-radius:10px}
.cs i{background:var(--lamp)}.cs i.y{background:var(--violet)}
.seat.host{box-shadow:0 0 0 2px #F2C14E}
.pulse{border-radius:12px}
.tb h3{font-size:17px;letter-spacing:-.02em}.et h3{font-size:16px}.sh h2{font-weight:400}
@media (max-width:640px){.navrow{display:grid;grid-template-columns:minmax(0,1fr)}.navrow>*{min-width:0}.sels{display:grid;grid-template-columns:1fr 1fr}.sels .lang{min-width:0;width:100%}.tb h3{font-size:16px}}
.ucard{position:fixed;z-index:40;width:260px;background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:0 18px 44px rgba(0,0,0,.5);padding:16px;font-size:13px;color:var(--mute);animation:ufade .14s ease both}
.ucard[hidden]{display:none}
@keyframes ufade{from{opacity:0;transform:translateY(4px)}}
.ucard .uh{display:flex;gap:12px;align-items:center}
.ucard .uh svg{width:48px;height:48px;border-radius:50%;border:2px solid var(--line)}
.ucard .uh.m svg{border-color:var(--lamp)}
.ucard .un{color:var(--fg);font-size:15.5px;font-weight:500}
.ucard .ur{font-size:12px;margin-top:2px}
.ucard .ur i{font-style:normal;color:var(--lamp)}
.ucard .ub{margin:12px 0 0;line-height:1.5;color:var(--soft)}
.ucard .us{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px;text-align:center}
.ucard .us div{background:var(--raise);border-radius:10px;padding:8px 4px;font-size:11px}
.ucard .us b{display:block;color:var(--fg);font-size:15px;font-weight:500}
.ucard .us .coin b{color:#F2C14E}
.ucard .ut{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}
.ucard .ut span{font-size:11px;padding:4px 9px;border-radius:999px;background:var(--raise);color:var(--fg)}
.ucard a{display:block;margin-top:12px;color:var(--lamp);text-decoration:none;font-weight:500}
.tbl{align-items:stretch}.tbl .ring{align-self:center}.tb{height:100%}.tf{margin-top:auto;padding-top:6px}
.seat[data-u]{cursor:pointer}.seat[data-u]:hover{z-index:2;transform:scale(1.12)}.seat{transition:transform .12s}
.lf{display:flex;align-items:center;gap:8px}
.lf .fc{display:flex}.lf .fc span{width:26px;height:26px;border-radius:50%;overflow:hidden;border:2px solid var(--bg);margin-left:-8px;cursor:pointer;transition:transform .12s}.lf .fc span:first-child{margin-left:0;box-shadow:0 0 0 1.5px #F2C14E}
.lf .fc span:hover{transform:translateY(-2px);position:relative;z-index:2}
.lf .fc span{position:relative}
.lf .fc span:hover{z-index:50!important}.lf .fc svg{width:100%;height:100%;display:block}
.lf small{font-size:12px;color:var(--mute)}.lf .fc .you{box-shadow:0 0 0 1.5px var(--violet)}
@media (max-width:900px){.ev .chairs{flex-wrap:wrap;gap:6px 10px;min-width:0}.ev .chairs>span{white-space:nowrap}}
@media (max-width:640px){.ev{grid-template-columns:72px minmax(0,1fr)}.tm span{white-space:nowrap;font-size:11.5px}}

/* ported sheets */
:root{--panel:#20264A;--field:#252B52;--text:#EEF1FF;--teal:#17C3C8;--gold:#F2C14E}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
.blink{animation:blink 1.2s ease-in-out infinite}
.lown .cta{width:auto;padding:0 22px;min-height:44px;border-radius:999px}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:12px;font-weight:500;letter-spacing:1px;padding:8px 12px;border-radius:6px;background:#313966;color:var(--text);text-transform:uppercase}
.badge.live{background:#1FA463;color:#fff;border-radius:6px}
.badge.live span{width:8px;height:8px;border-radius:5px;background:#fff}
.cta{width:100%;min-height:48px;border-radius:12px;font-size:16px;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--text);transition:background .15s,border-color .15s}
.cta:hover{border-color:var(--teal)}
.cta.go{background:var(--teal);border-color:var(--teal);color:#0D1030;font-weight:500}
.cta.go:hover{background:#36D6DA}
.cta.done{border-color:var(--teal);color:var(--teal)}
.own .cta{width:auto;align-self:flex-start;padding:0 22px}
/* reserve sheet */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(9,11,28,.62);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 20px 20px;opacity:0;transition:opacity .2s}
.scrim[hidden]{display:none}
.scrim.on{opacity:1}
.sheet{width:100%;max-width:460px;max-height:calc(94vh - 20px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.5);transform:translateY(16px);transition:transform .25s}
.scrim.on .sheet{transform:none}
.sheet .x{float:right;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--mute);font-size:18px;cursor:pointer;margin:-6px -6px 0 0}
.sheet h2{margin:0;font-size:22px;font-weight:500;letter-spacing:-.5px}
.sheet .sub{margin:6px 0 0;color:var(--mute);font-size:14px}
.sum{display:flex;gap:14px;align-items:center;margin-top:20px;padding:14px;border-radius:16px;background:var(--field);border:1px solid var(--line)}
.sum .thumb{flex:0 0 58px;width:58px;height:58px;border-radius:50%;overflow:hidden;border:2px solid var(--c)}
.sum .thumb img,.sum .thumb svg{width:100%;height:100%;object-fit:cover;display:block;position:static;border:0;box-shadow:none}
.sum b{display:block;font-weight:500;font-size:15.5px;line-height:1.35}
.sum small{display:block;margin-top:4px;color:var(--c);font-size:11.5px;letter-spacing:1px;text-transform:uppercase}
.facts{margin:16px 0 0;padding:0;list-style:none;display:grid;gap:12px}
.facts li{display:flex;gap:12px;align-items:center;font-size:14.5px}
.facts svg{flex:0 0 20px;width:20px;height:20px}
.facts span{color:var(--mute)}
.who{display:flex;align-items:center;gap:10px;margin-top:18px;font-size:13.5px;color:var(--mute)}
.who .ppl{display:flex}
.who .ppl span{margin-left:-8px;border:2px solid var(--panel);border-radius:50%;line-height:0}
.who .ppl span:first-child{margin-left:0}
.who svg{width:30px;height:30px;border-radius:50%}
.opt{margin-top:20px}
.opt label.l{display:block;font-size:13px;color:var(--mute);margin-bottom:8px}
.seg{display:flex;padding:4px;border-radius:12px;background:var(--field);border:1px solid var(--line)}
.seg button{flex:1;min-height:38px;border:0;border-radius:9px;background:none;color:var(--mute);font-size:14px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--text);color:#121633;font-weight:500}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:14.5px;cursor:pointer}
.tog input{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;cursor:pointer;transition:.2s;flex:0 0 44px;margin:0}
.tog input:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tog input:checked{background:var(--teal)}
