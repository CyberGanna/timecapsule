a y da propina a esta mesa","Βαθμολόγησε και δώσε φιλοδώρημα σε αυτό το τραπέζι"],"Rate and tip yesterday's table":["Vota il tavolo di ieri e lascia una mancia","Valora la mesa de ayer y da propina","Βαθμολόγησε και δώσε φιλοδώρημα στο χθεσινό τραπέζι"],"Rate the table and award TimeCoins":["Vota il tavolo e assegna TimeCoins","Valora la mesa y da TimeCoins","Βαθμολόγησε το τραπέζι και δώσε TimeCoins"],"How was the discussion?":["Com'è stata la discussione?","¿Qué tal la conversación?","Πώς ήταν η συζήτηση;"],"Pick an answer to continue":["Scegli una risposta per continuare","Elige una respuesta para continuar","Διάλεξε μια απάντηση για να συνεχίσεις"],"Add a note (optional)":["Aggiungi una nota (facoltativa)","Añade una nota (opcional)","Πρόσθεσε ένα σχόλιο (προαιρετικό)"],"Note about the discussion":["Nota sulla discussione","Nota sobre la conversación","Σχόλιο για τη συζήτηση"],"Next: award TimeCoins":["Avanti: assegna TimeCoins","Siguiente: dar TimeCoins","Επόμενο: δώσε TimeCoins"],"Award TimeCoins":["Assegna TimeCoins","Dar TimeCoins","Δώσε TimeCoins"],"Award your favorite panelists":["Premia i partecipanti preferiti","Premia a tus participantes favoritos","Επιβράβευσε τους αγαπημένους σου ομιλητές"],"Award anyone at the table after the talk":["Premia chiunque al tavolo dopo la discussione","Premia a cualquiera de la mesa después de la charla","Επιβράβευσε όποιον ήταν στο τραπέζι μετά την κουβέντα"],"Split your TimeCoins between the host and the participants who made it worth it.":["Dividi i tuoi TimeCoins tra l'host e i partecipanti che l'hanno resa preziosa.","Reparte tus TimeCoins entre el anfitrión y los participantes que hicieron que valiera la pena.","Μοίρασε τα TimeCoins σου ανάμεσα στον οικοδεσπότη και τους συμμετέχοντες που την έκαναν να αξίζει."],"You have 8 TimeCoins. Tip whoever inspired you today.":["Hai 8 TimeCoins. Premia chi ti ha ispirato oggi.","Tienes 8 TimeCoins. Da propina a quien te inspiró hoy.","Έχεις 8 TimeCoins. Δώσε φιλοδώρημα σε όποιον σε ενέπνευσε σήμερα."],"They're yours to give away, not to keep. Any you don't award within 3 days expire.":["Sono da regalare, non da tenere. Quelli non assegnati entro 3 giorni scadono.","Son para regalar, no para guardar. Los que no des en 3 días caducan.","Είναι για να τα δώσεις, όχι για να τα κρατήσεις. Όσα δεν δώσεις μέσα σε 3 ημέρες λήγουν."],"TimeCoins become reputation":["I TimeCoins diventano reputazione","Los TimeCoins se convierten en reputación","Τα TimeCoins γίνονται φήμη"],"They show on each person's profile and can't be spent or passed on.":["Compaiono sul profilo di ciascuno e non si possono spendere né cedere.","Aparecen en el perfil de cada persona y no se pueden gastar ni pasar.","Φαίνονται στο προφίλ του καθενός και δεν ξοδεύονται ούτε μεταβιβάζονται."],"TimeCoins are how people build their reputation on TimeCapsule. Even one coin tells Gregory and the panelists their voice mattered today.":["Con i TimeCoins le persone costruiscono la loro reputazione su TimeCapsule. Anche una sola moneta dice a Gregory e ai partecipanti che la loro voce oggi contava.","Con los TimeCoins la gente construye su reputación en TimeCapsule. Incluso una moneda le dice a Gregory y a los participantes que su voz importó hoy.","Με τα TimeCoins οι άνθρωποι χτίζουν τη φήμη τους στο TimeCapsule. Ακόμα και ένα νόμισμα λέει στον Gregory και στους ομιλητές ότι η φωνή τους μέτρησε σήμερα."],"Skip without tip":["Salta senza mancia","Omitir sin propina","Παράλειψη χωρίς φιλοδώρημα"],"Leave without a tip?":["Andare via senza mancia?","¿Salir sin dar propina?","Φεύγεις χωρίς φιλοδώρημα;"],"Leave anyway":["Esci comunque","Salir de todos modos","Φύγε πάντως"],"Stay and rate":["Resta e vota","Quedarse y valorar","Μείνε και βαθμολόγησε"],"Your TimeCoins are on their way":["I tuoi TimeCoins sono in arrivo","Tus TimeCoins van de camino","Τα TimeCoins σου είναι καθ' οδόν"],"Your rating was sent":["La tua valutazione è stata inviata","Tu valoración se ha enviado","Η βαθμολογία σου στάλθ ge them anytime in Settings.":["Le tue risposte ci aiutano a suggerirti tavoli e persone con gusti simili. Le usa solo TimeCapsule, mai per la pubblicità. Puoi cambiarle quando vuoi nelle Impostazioni.","Tus respuestas nos ayudan a sugerirte mesas y personas con gustos parecidos. Solo las usa TimeCapsule, nunca para anuncios. Puedes cambiarlas cuando quieras en Ajustes.","Οι απαντήσεις σου μας βοηθούν να σου προτείνουμε τραπέζια και ανθρώπους με παρόμοιο γούστο. Τις χρησιμοποιεί μόνο το TimeCapsule και ποτέ για διαφημίσεις. Μπορείς να τις αλλάξεις όποτε θέλεις στις Ρυθμίσεις."],"Optional. A friendly face helps people say hello.":["Facoltativo. Un volto amico aiuta le persone a salutarti.","Opcional. Una cara amable ayuda a que la gente te salude.","Προαιρετικό. Ένα φιλικό πρόσωπο βοηθά τους άλλους να σε χαιρετήσουν."],"Can’t find it? Add it yourself":["Non lo trovi? Aggiungilo tu","¿No lo encuentras? Añádelo tú","Δεν το βρίσκεις; Πρόσθεσέ το μόνος σου"],"Choose another":["Scegline un altro","Elegir otro","Διάλεξε άλλο"],"A second star":["Una seconda stella","Una segunda estrella","Ένα δεύτερο αστέρι"],"Back":["Indietro","Atrás","Πίσω"],"Art":["Arte","Arte","Τέχνη"],"Music":["Musica","Música","Μουσική"],"Book":["Libro","Libro","Βιβλίο"],"Film":["Film","Película","Ταινία"],"Egypt":["Egitto","Egipto","Αίγυπτος"],"France":["Francia","Francia","Γαλλία"],"Germany":["Germania","Alemania","Γερμανία"],"Ghana":["Ghana","Ghana","Γκάνα"],"India":["India","India","Ινδία"],"Italy":["Italia","Italia","Ιταλία"],"Japan":["Giappone","Japón","Ιαπωνία"],"Spain":["Spagna","España","Ισπανία"],"Switzerland":["Svizzera","Suiza","Ελβετία"],"Turkey":["Turchia","Turquía","Τουρκία"],"United Kingdom":["Regno Unito","Reino Unido","Ηνωμένο Βασίλειο"],"United States":["Stati Uniti","Estados Unidos","Ηνωμένες Πολιτείες"],"Mute Gregory":["Silenzia Gregory","Silenciar a Gregory","Σίγαση του Gregory"],"Ana only":["Solo Ana","Solo Ana","Μόνο η Ana"],"Notes tab":["Scheda Note","Pestaña Notas","Καρτέλα Σ
