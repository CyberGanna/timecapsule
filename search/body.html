const BYID=Object.fromEntries(T.map(t=>[t.id,t]));
const S={q:"",type:"all",when:"",lang:"",saved:new Set(),wait:new Set(),follow:new Set(["Gregory"]),open:new Set()};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const tr=s=>window.TCI18N?TCI18N.t(s):s;
const SHIELD='<svg viewBox="0 0 11 12" aria-hidden="true"><path d="M5.5 .5l4.5 1.8v3.4c0 2.8-1.9 5.1-4.5 5.8C2.9 10.8 1 8.5 1 5.7V2.3z" fill="#12304A"/><path d="M3.4 5.9l1.5 1.5 2.8-2.9" fill="none" stroke="#7FF0F2" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const ADD='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="8" r="4"/><path d="M3 20c0-3.9 3.1-6 7-6s7 2.1 7 6M19 8v6M16 11h6"/></svg>';
const OK='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CLOCK='<svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.8V8l2.2 1.5"/></svg>';
const X='<svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
const DAYN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dayKey=d=>{const a=new Date(d);a.setHours(0,0,0,0);const b=new Date(NOW);b.setHours(0,0,0,0);return Math.round((a-b)/864e5)};
const dayName=k=>k===0?"Today":k===1?"Tomorrow":k===-1?"Yesterday":(()=>{const d=new Date(NOW);d.setDate(d.getDate()+k);return `${DAYN[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`})();
const hhmm=d=>`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
const until=d=>{const m=Math.round((d-Date.now())/60000);if(m<=0)return"now";if(m<60)return`in ${m} min`;const h=Math.floor(m/60);return`in ${h} h`};
const state=t=>t.live?"live":dayKey(t.at)<0||t.at<NOW?"past":"up";

/* matching: every word must appear somewhere; topic names also match in Italian and Spanish */
function words(){return norm(S.q).split(/\s+/).filter(Boolean)}
function hay(parts){return norm(parts.join(" ")+" "+parts.map(tr).join(" "))}
const hit=(h,W)=>W.every(w=>h.includes(w));
function mk(s,W){ // highlight matched words in plain demo text
  let out=esc(s);if(!W.length)return out;
  const n=norm(s);const marks=[];
  W.forEach(w=>{let i=n.indexOf(w);while(i>=0){marks.push([i,i+w.length]);i=n.indexOf(w,i+w.length)}});
  if(!marks.length)return out;
  marks.sort((a,b)=>a[0]-b[0]);const m=[];marks.forEach(x=>{const l=m[m.length-1];if(l&&x[0]<=l[1])l[1]=Math.max(l[1],x[1]);else m.push(x.slice())});
  let r="",p=0;m.forEach(([a,b])=>{r+=esc(s.slice(p,a))+"<mark>"+esc(s.slice(a,b))+"</mark>";p=b});return r+esc(s.slice(p));
}
function tableOk(t){
  if(S.lang&&t.lang!==S.lang)return false;
  const st=state(t);
  if(S.when==="live"&&st!=="live")return false;
  if(S.when==="today"&&(st==="past"||(st==="up"&&dayKey(t.at)!==0)))return false;
  if(S.when==="week"&&(st==="past"||(st==="up"&&dayKey(t.at)>6)))return false;
  if(S.when==="past"&&st!=="past")return false;
  return true;
}
function results(){
  const W=words();
  const tb=T.filter(t=>tableOk(t)&&hit(hay([t.title,t.theme,t.host,t.city,t.lang]),W));
  const ord={live:0,up:1,past:2};
  tb.sort((a,b)=>ord[state(a)]-ord[state(b)]||(state(a)==="live"?b.live-a.live:state(a)==="past"?b.at-a.at:a.at-b.at));
  const pp=U.filter(u=>{
    if(S.when==="live"&&!(u.nx&&BYID[u.nx].live))return false;
    if(S.when==="today"&&!(u.nx&&(BYID[u.nx].live||dayKey(BYID[u.nx].at)===0)))return false;
    if(S.when==="past")return false;
    return hit(hay([u.n,u.city,u.bio,...u.tags]),W)});
  pp.sort((a,b)=>(norm(b.n).startsWith(W[0]||"\u0001")?1:0)-(norm(a.n).startsWith(W[0]||"\u0001")?1:0)||b.t-a.t||b.r-a.r);
  const tp=Object.keys(C).filter(k=>hit(hay([k]),W));
  return {W,tb,pp,tp};
}
const tcount=k=>T.filter(t=>t.theme===k&&state(t)!=="past").length;
const pcount=k=>U.filter(u=>u.tags.includes(k)).length;

function topicPills(list){return `<div class="tps">${list.map(k=>`<button class="tpc" style="--c:${C[k]}" data-topic="${k}"><i></i><span>${k}</span><small>${tcount(k)} ${tcount(k)===1?"table":"tables"}</small></button>`).join("")}</div>`}
function chairs(t){
  const mine=S.saved.has(t.id), k=t.people.length+(mine?1:0), left=t.seats-k;
  const fc=t.people.slice(0,5).map((p,i)=>`<span style="z-index:${9-i}">${av(p)}</span>`).join("");
  return `<div class="chairs"><span class="fc">${fc}</span><span>${state(t)==="past"?`${t.people.length} ${t.people.length===1?"person":"people"}`:left>0?`${left} of ${t.seats} chairs free`:'<span class="full">Full · waitlist open</span>'}</span></div>`;
}
function row(t,W){
  const c=C[t.theme], st=state(t), full=t.people.length>=t.seats;
  const tm=st==="live"?`<div class="tm lv"><b><i></i>LIVE</b><span>${t.live} min in</span></div>`
    :st==="past"?`<div class="tm ps"><b>${dayName(dayKey(t.at))}</b><span>${hhmm(t.at)}</span></div>`
    :`<div class="tm"><b>${hhmm(t.at)}</b><span>${dayKey(t.at)===0?until(t.at):dayName(dayKey(t.at))}</span></div>`;
  let btn;
  if(st==="live")btn=full?`<button class="jbtn ghost" data-wait="${t.id}">Join waitlist</button>`:`<a class="jbtn" href="${LIVE_TABLE}" target="_top">Join</a>`;
  else if(st==="past")btn=t.kept?`<button class="jbtn ghost" data-kept="${t.id}" aria-expanded="${S.open.has(t.id)}">${S.open.has(t.id)?"Hide":"Transcript"}</button>`:`<span class="meta" style="justify-self:end">No transcript</span>`;
  else btn=S.wait.has(t.id)?`<button class="jbtn on" data-wait="${t.id}">On the waitlist</button>`:full?`<button class="jbtn ghost" data-wait="${t.id}">Join waitlist</button>`:S.saved.has(t.id)?`<button class="jbtn on" data-save="${t.id}">Chair saved</button>`:`<button class="jbtn ghost" data-save="${t.id}">Save a chair</button>`;
  const kept=st==="past"&&t.kept&&S.open.has(t.id)?`<div class="kept"><small>From the transcript</small>${t.kept.map(([w,q])=>`<p><b>${w}</b><span data-noi18n>${mk(q,W)}</span></p>`).join("")}</div>`:"";
  return `<article class="ev" style="--c:${c}">${tm}
    <div class="ei"><div class="th" style="background:radial-gradient(circle at 35% 30%,${c},${c}66 75%,#252B52)"><svg viewBox="0 0 24 24" aria-hidden="true">${TICON[t.theme]}</svg></div><div class="et"><h3 data-noi18n>${mk(t.title,W)}</h3>
      <div class="meta"><span class="topic"><i></i>${t.theme}</span> · <span>with</span> <b data-noi18n>${mk(t.host,W)}</b>${t.lang!=="English"?` · ${t.lang}`:""}</div></div></div>
    ${chairs(t)}${btn}${kept}</article>`;
}
function tableList(list,W,limit){
  const L=limit?list.slice(0,limit):list;let h="",last="";
  L.forEach(t=>{const st=state(t);const g=st==="live"?"Happening now":st==="past"?"Past tables":"Upcoming";
    if(g!==last){if(last)h+="</div>";h+=`<p class="sub">${g}</p><div class="agenda">`;last=g}h+=row(t,W)});
  return h+(last?"</div>":"");
}
function nextLine(u){
  if(!u.nx)return `<div class="pnx idle"><span>Joins tables. Not hosting right now.</span></div>`;
  const t=BYID[u.nx];
  const w=t.live?`<small class="lv"><i></i>Live now</small>`:`<small>${dayKey(t.at)===0?(Math.round((t.at-NOW)/60000)<60?`In ${Math.round((t.at-NOW)/60000)} min`:"Today · "+hhmm(t.at)):dayName(dayKey(t.at))+" · "+hhmm(t.at)}</small>`;
  return `<div class="pnx">${w}<span data-noi18n>${esc(t.title)}</span></div>`;
}
function prow(u,W){
  const f=S.follow.has(u.n);
  return `<article class="pr"><a class="cover" href="${PROFILE}" target="_top" aria-label="Open ${u.n}'s profile"></a>
   <div class="pav" style="--ring:${u.t?"#7FF0F2":"var(--line)"}">${av(u.n)}</div>
   <div class="pi"><div class="pn"><b data-noi18n>${mk(u.n,W)}</b>${u.t?`<span class="trust">${SHIELD}Trusted</span>`:""}</div>
    <div class="pm"><span data-noi18n>${mk(u.city,W)}</span>${u.tags.map(k=>`<span class="topic" style="--c:${C[k]}"><i></i>${k}</span>`).join("")}</div></div>
   ${nextLine(u)}
   <button class="fol" data-fol="${u.n}" aria-pressed="${f}">${f?OK+"Following":ADD+"Follow"}</button></article>`;
}
function sec(id,title,n,body,more){
  return `<section class="sec" id="s-${id}"><div class="sh"><h2>${title}</h2><span class="n">${n}</span>${more?`<button class="more" data-type="${id}"><span>See all</span><span>${n}</span></button>`:""}</div>${body}</section>`;
}

/* recent searches: per browser, demo defaults */
const RK="tc-search-recent";
let RECENT=["stoicism","Elif","home batteries"];
try{const v=JSON.parse(localStorage.getItem(RK)||"null");if(Array.isArray(v))RECENT=v}catch(e){}
function saveRecent(){try{localStorage.setItem(RK,JSON.stringify(RECENT))}catch(e){}}
function remember(q){q=q.trim();if(q.length<2)return;RECENT=[q,...RECENT.filter(x=>norm(x)!==norm(q))].slice(0,6);saveRecent()}

function render(){
  const q=S.q.trim(), out=document.getElementById("out"), sum=document.getElementById("sum"), fl=document.getElementById("filters");
  document.getElementById("clr").hidden=!S.q;
  if(!q){
    fl.hidden=true; sum.textContent="";
    const live=T.filter(t=>t.live).sort((a,b)=>b.people.length-a.people.length).slice(0,3);
    out.innerHTML=(RECENT.length?`<section class="sec"><div class="sh"><h2>Recent searches</h2><button class="clear" data-clear-recent>Clear</button></div><div class="recent">${RECENT.map((r,i)=>`<span class="rc"><button data-q="${esc(r)}">${CLOCK}<span data-noi18n>${esc(r)}</span></button><button class="x" data-rm="${i}" aria-label="Remove">${X}</button></span>`).join("")}</div></section>`:"")
      +`<section class="sec"><div class="sh"><h2>Topics to explore</h2></div>${topicPills(Object.keys(C))}</section>`
      +`<section class="sec"><div class="sh"><h2>Happening now</h2><span class="n">${T.filter(t=>t.live).length} ${T.filter(t=>t.live).length===1?"table":"tables"}</span></div>${'<div class="agenda">'+live.map(t=>row(t,[])).join("")+"</div>"}</section>`;
    return;
  }
  const R=results(), W=R.W, total=R.tb.length+R.pp.length+R.tp.length;
  fl.hidden=false;
  const P=[["all","All",total],["tables","Tables",R.tb.length],["people","People",R.pp.length],["topics","Topics",R.tp.length]];
  document.getElementById("pills").innerHTML=P.map(([k,l,n])=>`<button class="day" data-type="${k}" aria-pressed="${S.type===k}"${k!=="all"&&!n&&S.type!==k?" disabled":""}><span>${l}</span><span class="cnt">${n}</span></button>`).join("");
  sum.innerHTML=`<b>${total}</b> <span>${total===1?"result":"results"}</span> <span>for</span> <q data-noi18n>${esc(q)}</q>`;
  if(!total){
    const filt=S.when||S.lang;
    if(!filt){fl.hidden=true;sum.textContent=""}
    out.innerHTML=`<div class="none"><h2><span>Nothing matches</span> <q data-noi18n>${esc(q)}</q></h2><p>${filt?"Nothing here with these filters.":"No table, person or topic yet. Check the spelling, or try a broader word."}</p>${filt?`<button class="x" data-unfilter>Clear filters</button>`:""}</div>`
      +`<div class="host"><div><h3>Nobody is talking about this yet.</h3><p>Open a table about it and be the first.</p></div><a href="${CREATE}" target="_top">Open a table</a></div>`
      +`<section class="sec"><div class="sh"><h2>Topics to explore</h2></div>${topicPills(Object.keys(C))}</section>`;
    return;
  }
  const one=S.type!=="all";
  const blocks={
    topics:()=>R.tp.length?sec("topics","Topics",R.tp.length,topicPills(R.tp),false):"",
    people:()=>R.pp.length?sec("people","People",R.pp.length,`<div class="plist">${(one?R.pp:R.pp.slice(0,3)).map(u=>prow(u,W)).join("")}</div>`,!one&&R.pp.length>3):"",
    tables:()=>R.tb.length?sec("tables","Tables",R.tb.length,tableList(R.tb,W,one?0:5),!one&&R.tb.length>5):""
  };
  let order=["tables","people","topics"];
  if(R.tp.some(k=>W.length===1&&norm(k)===W[0]||norm(tr(k))===W.join(" ")))order=["topics","tables","people"];
  else if(R.pp.some(u=>norm(u.n).startsWith(W[0])))order=["people","tables","topics"];
  out.innerHTML=(one?blocks[S.type]():order.map(k=>blocks[k]()).join(""))||`<div class="none"><p>Nothing here with these filters.</p><button class="x" data-unfilter>Clear filters</button></div>`;
}

const qi=document.getElementById("q");
function setQ(v,save){S.q=v;qi.value=v;S.type="all";S.open.clear();if(save)remember(v);sync();render();window.scrollTo({top:0})}
function sync(){try{const h=S.q.trim()?"#q="+encodeURIComponent(S.q.trim()):"";history.replaceState(history.state,"",location.pathname+location.search+h)}catch(e){}}
const toast=t=>{const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),2200)};
let tq;
qi.addEventListener("input",()=>{S.q=qi.value;S.type="all";S.open.clear();render();clearTimeout(tq);tq=setTimeout(sync,300)});
qi.addEventListener("keydown",e=>{if(e.key==="Enter"){remember(qi.value);sync();qi.blur()}if(e.key==="Escape"&&qi.value){e.stopPropagation();setQ("")}});
document.getElementById("clr").addEventListener("click",()=>{setQ("");qi.focus()});
document.getElementById("when").addEventListener("change",e=>{S.when=e.target.value;render()});
document.getElementById("lng").addEventListener("change",e=>{S.lang=e.target.value;render()});
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-q]");if(g){setQ(g.dataset.q,true);return}
  const rm=e.target.closest("[data-rm]");if(rm){RECENT.splice(+rm.dataset.rm,1);saveRecent();render();return}
  if(e.target.closest("[data-clear-recent]")){RECENT=[];saveRecent();render();return}
  const tp=e.target.closest("[data-topic]");if(tp){setQ(tr(tp.dataset.topic),true);return}
  const ty=e.target.closest("[data-type]");if(ty){S.type=ty.dataset.type;render();document.getElementById("filters").scrollIntoView({block:"start"});return}
  if(e.target.closest("[data-unfilter]")){S.when="";S.lang="";document.getElementById("when").value="";document.getElementById("lng").value="";render();return}
  const kp=e.target.closest("[data-kept]");if(kp){const id=+kp.dataset.kept;S.open.has(id)?S.open.delete(id):S.open.add(id);render();return}
  const sv=e.target.closest("[data-save]");if(sv){const id=+sv.dataset.save;if(S.saved.has(id))S.saved.delete(id);else{S.saved.add(id);toast("Saved. You'll get a reminder 10 minutes before")}render();return}
  const wt=e.target.closest("[data-wait]");if(wt){const id=+wt.dataset.wait;if(S.wait.has(id)){S.wait.delete(id);toast("You left the waitlist.")}else{S.wait.add(id);toast("You're on the waitlist. We'll tell you if a chair opens up.")}render();return}
  const fo=e.target.closest("[data-fol]");if(fo){e.preventDefault();const n=fo.dataset.fol;if(S.follow.has(n)){S.follow.delete(n);toast(`You stopped following ${n}`)}else{S.follow.add(n);toast(`We'll tell you when ${n} hosts next`)}render();return}
  const res=e.target.closest("#out a,#out .jbtn");if(res&&S.q.trim())remember(S.q);
});
window.addEventListener("tc-lang",render);
/* start from #q=… so other pages can link here; demo default otherwise */
(function(){let v=null;try{const m=location.hash.match(/[#&]q=([^&]*)/);if(m)v=decodeURIComponent(m[1].replace(/\+/g," "))}catch(e){}
  if(v===null&&!/[#&]empty\b/.test(location.hash))v="free will";
  S.q=v||"";qi.value=S.q;render();sync();
  if(matchMedia("(hover:hover)").matches&&!S.q)qi.focus();})();
</script>
